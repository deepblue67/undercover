<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Undercover Famille</title>
<meta name="description" content="Le jeu Undercover pour jouer en famille, sur un seul téléphone ou un téléphone par joueur : qui a un mot différent ?">
<meta name="theme-color" content="#1b1640">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Undercover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI Rounded","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:#1b1640;background-image:radial-gradient(circle at 15% 0%,#3d2c94 0,transparent 55%),radial-gradient(circle at 100% 100%,#5b1f6e 0,transparent 50%);background-attachment:fixed;color:#fff;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 18px)}
.screen{flex:1;display:flex;flex-direction:column;gap:14px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:2rem;margin:.1em 0;line-height:1.1}
h2{font-size:1.4rem;margin:.1em 0;line-height:1.2}
h3{font-size:1.1rem;margin:1em 0 .3em}
p{margin:.2em 0;line-height:1.4}
.muted{color:#c3bdf0}.small{font-size:.92rem}
.center{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.grow{flex:1}
.btn{appearance:none;border:0;border-radius:18px;padding:16px 18px;font:inherit;font-size:1.15rem;font-weight:800;color:#1b1640;background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.28);cursor:pointer;width:100%;transition:transform .08s,box-shadow .08s;touch-action:manipulation;line-height:1.2}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.btn small{font-weight:700;opacity:.75;font-size:.85em}
.btn.primary{background:#ffcc33}.btn.green{background:#3ddc97}.btn.red{background:#ff5d73;color:#fff}
.btn.ghost{background:rgba(255,255,255,.11);color:#fff;box-shadow:none;font-weight:700}
.btn.big{font-size:1.3rem;padding:20px}
.btn:disabled{opacity:.35;pointer-events:none}
.row{display:flex;gap:10px;align-items:center}.row>.btn{flex:1}
.between{justify-content:space-between}
.card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:16px}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--c);width:44px;height:44px;font-size:1.5rem;flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15);line-height:1}
button.av{border:0;cursor:pointer;padding:0}
.av.l{width:96px;height:96px;font-size:3.1rem}.av.xl{width:128px;height:128px;font-size:4.2rem}.av.s{width:32px;height:32px;font-size:1.05rem}
.av.out{filter:grayscale(1);opacity:.4}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}
.top h2{flex:1;text-align:center}
.pill{background:rgba(255,255,255,.12);padding:7px 14px;border-radius:99px;font-weight:800;font-size:.95rem}
.icon{background:rgba(255,255,255,.12);border:0;color:#fff;width:44px;height:44px;border-radius:14px;font-size:1.3rem;cursor:pointer;flex:none;font-family:inherit}
input{width:100%;min-width:0;padding:13px 14px;border-radius:14px;border:2px solid transparent;background:rgba(255,255,255,.12);color:#fff;font:inherit;font-size:1.08rem;font-weight:700}
input::placeholder{color:rgba(255,255,255,.45)}
input:focus{outline:none;border-color:#ffcc33}
.plist{display:flex;flex-direction:column;gap:10px}
.prow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pgroups{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;padding-left:60px;margin-top:-2px}
.gchip{border:1.5px solid rgba(255,255,255,.22);background:transparent;color:#c3bdf0;border-radius:99px;padding:4px 10px;font:inherit;font-size:.82rem;font-weight:700;cursor:pointer}
.gchip.on{background:#ffcc33;border-color:#ffcc33;color:#1b1640}
.mini{width:40px;height:40px;border:0;border-radius:12px;background:rgba(255,255,255,.1);color:#fff;font-size:1rem;cursor:pointer;flex:none;font-family:inherit}
.mini:disabled{opacity:.25}
.stepper{width:48px;height:48px;border:0;border-radius:14px;background:#ffcc33;color:#1b1640;font-size:1.6rem;font-weight:900;cursor:pointer;font-family:inherit;box-shadow:0 4px 0 rgba(0,0,0,.25);line-height:1}
.stepper:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.stepper:disabled{opacity:.3;pointer-events:none}
.cnt{font-size:2rem;font-weight:900;min-width:2ch;text-align:center}
.seg{display:flex;gap:5px;background:rgba(0,0,0,.22);padding:5px;border-radius:14px}
.seg button{flex:1;border:0;border-radius:10px;padding:10px 4px;background:transparent;color:#fff;font:inherit;font-weight:800;font-size:.95rem;cursor:pointer}
.seg button.on{background:#ffcc33;color:#1b1640}
.set{display:flex;flex-direction:column;gap:7px}
.set label{font-weight:800}
.set .note{font-size:.85rem;color:#c3bdf0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;border-radius:99px;padding:9px 13px;background:rgba(255,255,255,.1);color:#fff;font:inherit;font-weight:800;font-size:.95rem;cursor:pointer}
.chip.on{background:#4cc9f0;color:#1b1640}
.hero .logo{font-size:5rem;filter:drop-shadow(0 8px 20px rgba(0,0,0,.35));animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(-4deg)}}
.title{font-size:3rem;font-weight:900;letter-spacing:-.02em;background:linear-gradient(90deg,#ffcc33,#ff5d73,#b388ff);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
.subtitle{font-size:1.3rem;font-weight:900;letter-spacing:.35em;text-transform:uppercase;color:#4cc9f0;margin-bottom:10px}
.hold{position:relative;min-height:280px;perspective:1100px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;cursor:pointer;text-align:center}
.hold .fc{position:absolute;inset:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .42s cubic-bezier(.3,1.35,.5,1);pointer-events:none}
.hold.on .fc{transform:rotateY(180deg)}
.hold .face{position:absolute;inset:0;border-radius:26px;display:flex;align-items:center;justify-content:center;padding:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.hold .front{background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.14) 0 18%,transparent 19%),radial-gradient(circle at 85% 90%,rgba(255,204,51,.16) 0 22%,transparent 23%),linear-gradient(145deg,#4b3bb5,#2a2163);border:3px dashed rgba(255,255,255,.35);box-shadow:0 10px 26px rgba(0,0,0,.3)}
.hold .front::after{content:'🕵️';position:absolute;right:16px;top:12px;font-size:1.6rem;opacity:.35}
.hold .back{background:#fff;color:#1b1640;border:3px solid #ffcc33;transform:rotateY(180deg);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.hold.on .back{animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 12px 34px rgba(255,204,51,.55)}}
@media (prefers-reduced-motion:reduce){.hold .fc{transition:none}}
.hold .hint{font-size:1.25rem;font-weight:800;color:#dcd7ff;pointer-events:none}
.hold .hint .big{font-size:3.5rem;display:block;margin-bottom:8px;animation:press 1.4s ease-in-out infinite}
@keyframes press{50%{transform:scale(.85)}}
.hold .word{pointer-events:none}
.word .lbl{font-size:1rem;color:#6b64a8;font-weight:800;margin-bottom:6px}
.word .w{font-size:2.7rem;font-weight:900;word-break:break-word;line-height:1.1}
.word .sub{font-size:1rem;color:#6b64a8;font-weight:700;margin-top:10px}
.queue{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.queue .av{opacity:.6}.queue .av.done{opacity:.25}.queue .av.cur{opacity:1;outline:3px solid #ffcc33;outline-offset:3px}
.timer{position:relative;width:90px;height:90px;margin:0 auto}
.timer svg{transform:rotate(-90deg);display:block}
.timer .ring{transition:stroke-dashoffset 1s linear}
.timer .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:900}
.timer.over .t{color:#ff5d73;animation:shake .4s 3}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.pcard{border:3px solid transparent;border-radius:20px;padding:16px 8px;background:rgba(255,255,255,.1);color:#fff;font:inherit;font-weight:800;font-size:1.1rem;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;word-break:break-word}
.pcard.sel{border-color:#ffcc33;background:rgba(255,204,51,.2)}
.pcard:active{transform:scale(.97)}
.cd{position:fixed;inset:0;background:rgba(27,22,64,.94);display:flex;align-items:center;justify-content:center;z-index:50;font-size:9rem;font-weight:900;text-align:center}
.cd span{animation:pop .7s ease both}
.cd span.go{font-size:3.2rem;color:#ffcc33}
@keyframes pop{from{transform:scale(2.2);opacity:0}to{transform:scale(1);opacity:1}}
.badge{display:inline-block;padding:14px 26px;border-radius:20px;font-size:1.9rem;font-weight:900;letter-spacing:.04em;animation:pop .5s ease both}
.b-civil{background:#3ddc97;color:#10302a}.b-under{background:#ff5d73;color:#fff}.b-white{background:#fff;color:#1b1640}
.shake{animation:shake .45s infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.qmark{font-size:5.5rem;font-weight:900}
.modal-bg{position:fixed;inset:0;background:rgba(10,8,30,.72);display:flex;align-items:flex-end;justify-content:center;z-index:40;animation:fade .2s}
.modal{background:#2a2163;width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:22px 18px calc(env(safe-area-inset-bottom) + 22px);display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto;animation:up .25s ease}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 26px);transform:translateX(-50%);background:#fff;color:#1b1640;padding:12px 18px;border-radius:14px;font-weight:800;z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.35);max-width:90vw;text-align:center;animation:up .2s}
.sl{display:flex;flex-direction:column;gap:8px}
.si{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border-radius:14px;padding:8px 12px}
.si .n{flex:1;font-weight:800;word-break:break-word}
.si .p{font-weight:900;font-size:1.2rem;min-width:2ch;text-align:right}
.si .role{font-size:1.3rem}
.plus{color:#3ddc97;font-weight:900}.zero{color:rgba(255,255,255,.35);font-weight:800}
.words{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.words div{background:rgba(255,255,255,.08);border-radius:16px;padding:12px;text-align:center}
.words b{display:block;font-size:1.35rem;margin-top:4px;word-break:break-word}
.words .u b{color:#ff8a9a}.words .c b{color:#7ef0bd}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:14px 0 6px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;width:31%;text-align:center}
.step .nm{font-weight:900;word-break:break-word}
.block{width:100%;border-radius:14px 14px 0 0;display:flex;flex-direction:column;align-items:center;padding-top:8px;font-size:1.6rem;font-weight:900;color:#1b1640}
.block small{font-size:.9rem}
.s1 .block{height:130px;background:#ffcc33}.s2 .block{height:95px;background:#d9d4ff}.s3 .block{height:70px;background:#ff9f43}
.rules ol,.rules ul{padding-left:1.2em;margin:.3em 0}.rules li{margin:.3em 0;line-height:1.4}
.tip{font-size:.9rem;color:#c3bdf0;text-align:center}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
a{color:#4cc9f0}
.foot{text-align:center;font-size:.8rem;color:rgba(255,255,255,.4)}
.list{display:flex;flex-direction:column;background:rgba(255,255,255,.08);border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,.12)}
.li{display:flex;align-items:center;gap:14px;padding:14px 16px;background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.08);color:#fff;font:inherit;text-align:left;cursor:pointer;width:100%}
.li:last-child{border-bottom:0}
.li:active{background:rgba(255,255,255,.06)}
.li .ic{font-size:1.6rem;width:36px;text-align:center;flex:none}
.li .tx{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.li .tx b{font-size:1.05rem}
.li .tx small{color:#c3bdf0;font-size:.86rem}
.li .chev{font-size:1.5rem;color:#c3bdf0;flex:none}
.sec{font-size:.8rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#c3bdf0;margin:10px 4px -4px}
.chip.pl{display:inline-flex;align-items:center;gap:7px;padding:5px 13px 5px 5px;position:relative}
.chip.pl .av{width:30px;height:30px;font-size:1.05rem}
.chip.pl.on{background:#ffcc33;color:#1b1640}
.chip.pl .num{position:absolute;top:-7px;right:-5px;background:#ff5d73;color:#fff;border-radius:99px;font-size:.75rem;min-width:21px;height:21px;display:flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.chip.add{background:transparent;border:2px dashed rgba(255,255,255,.35)}
textarea{width:100%;min-height:130px;border-radius:14px;border:2px solid transparent;background:rgba(0,0,0,.28);color:#fff;font:600 .82rem/1.35 ui-monospace,Menlo,Consolas,monospace;padding:12px;resize:vertical;word-break:break-all}
textarea:focus{outline:none;border-color:#ffcc33}
.hcard{display:block;width:100%;text-align:left;font:inherit;color:#fff;cursor:pointer}
.hcard:active{transform:scale(.99)}
.avs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.avs span.sc{display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.2);border-radius:99px;padding:3px 10px 3px 3px;font-weight:800;font-size:.9rem}
.avs .av{width:26px;height:26px;font-size:.9rem}
.rnd{background:rgba(255,255,255,.07);border-radius:14px;padding:10px 12px}
.rnd .h{display:flex;justify-content:space-between;gap:8px;font-weight:800}
.rnd .d{color:#c3bdf0;font-size:.88rem;margin-top:3px}
.spin{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.warn{background:rgba(255,204,51,.12);border:1px solid rgba(255,204,51,.35);border-radius:14px;padding:10px 12px;font-size:.88rem}
.linkbtn{background:none;border:0;color:#c3bdf0;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:6px}
/* mode un téléphone par joueur */
.code{display:flex;gap:8px;justify-content:center}
.code span{background:#fff;color:#1b1640;font-size:2.3rem;font-weight:900;width:54px;height:66px;border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 rgba(0,0,0,.28)}
.qr:empty{display:none}
.qr svg{width:168px;height:168px;background:#fff;border-radius:14px;padding:6px;display:block}
input.codein{text-align:center;font-size:2.3rem;letter-spacing:.45em;text-transform:uppercase;font-weight:900;padding:14px 14px 14px calc(14px + .45em)}
.avw{position:relative;display:inline-flex}
.avw .ck{position:absolute;right:-5px;bottom:-5px;background:#3ddc97;color:#10302a;border-radius:99px;width:20px;height:20px;font-size:.72rem;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.3)}
.avw .off{position:absolute;left:-7px;top:-7px;font-size:.8rem}
.q2 .av{opacity:1}.q2 .av.dim{opacity:.4}
.dot{width:10px;height:10px;border-radius:50%;background:#3ddc97;flex:none;box-shadow:0 0 0 3px rgba(61,220,151,.2)}
.dot.off{background:#ff5d73;box-shadow:0 0 0 3px rgba(255,93,115,.2)}
.pill.net{font-size:.85rem;letter-spacing:.08em;border:0;color:#fff;font-family:inherit;cursor:pointer}
.vt{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.wait{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
/* fil des indices */
.feed{display:flex;flex-direction:column;gap:6px;width:100%}
.feed .fr{display:flex;align-items:flex-start;gap:8px;background:rgba(255,255,255,.07);border-radius:14px;padding:7px 10px}
.feed .fr.out{opacity:.55}
.feed .fr .who{display:flex;align-items:center;gap:6px;font-weight:800;min-width:92px;flex:none;font-size:.9rem;padding-top:3px}
.feed .fr .cl{display:flex;flex-wrap:wrap;gap:5px;flex:1}
.feed .ct{background:#fff;color:#1b1640;border-radius:10px;padding:3px 9px;font-weight:800;font-size:.92rem;line-height:1.3}
.feed .ct.voice{background:rgba(255,255,255,.18);color:#fff}
.feed .ct.new{animation:pop2 .35s ease}
.feed .fr .rl{margin-left:auto;font-size:1.1rem;flex:none}
.feed .fr.under{background:rgba(255,93,115,.18)}.feed .fr.white{background:rgba(255,255,255,.14)}
.cluebox{display:flex;gap:8px;width:100%}
.cluebox input{flex:1;font-size:1.15rem;font-weight:700}
.cluebox .btn{width:auto;flex:none}
/* dépouillement */
.vrow{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border-radius:14px;padding:7px 10px;animation:pop2 .35s ease}
.vrow .n{font-weight:800}.vrow .ar{color:#ffcc33;font-weight:900;margin:0 2px}
.bars{display:flex;flex-direction:column;gap:7px;width:100%}
.bars .b{display:flex;align-items:center;gap:8px}
.bars .b .nm{width:84px;font-weight:800;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .b .tr{display:block;flex:1;height:22px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
.bars .b .fl{display:block;height:100%;background:linear-gradient(90deg,#ffcc33,#ff9f43);border-radius:99px;transition:width .45s ease;min-width:0}
.bars .b.top .fl{background:linear-gradient(90deg,#ff5d73,#ff9f43)}
.bars .b .ct{width:22px;text-align:right;font-weight:900}
/* ===== écran TV (paysage, lisible à 3 m) ===== */
body.tvmode #app{max-width:none;padding:2.2vh 2.2vw;height:100vh;height:100dvh;overflow:hidden}
body.tvmode .toast{font-size:3vh;padding:1.4vh 2vw}
.tvw{flex:1;display:flex;flex-direction:column;gap:1.8vh;min-height:0;font-size:2.4vh}
.tvbar{display:flex;align-items:center;gap:1.4vw;font-weight:900;font-size:2.4vh}
.tvbar .brand{font-size:3.4vh;background:linear-gradient(90deg,#ffcc33,#ff5d73,#b388ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.tvbar .sp{flex:1}
.tvbar .pill{font-size:2.4vh;padding:.8vh 1.4vw}
.tvbar .tb{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:1.4vh;padding:.8vh 1vw;font:inherit;font-size:2vh;cursor:pointer;opacity:.55}
.tvbar .tb:hover{opacity:1}
.tvmain{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 29vw;gap:1.8vw;min-height:0}
.stage{background:rgba(255,255,255,.05);border-radius:3vh;padding:3vh 2.6vw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;min-height:0;overflow:hidden;text-align:center;position:relative;animation:in .35s ease}
.stage h1{font-size:7vh;margin:0;line-height:1.05}
.stage h2{font-size:4.4vh;margin:0}
.stage .muted{font-size:3vh}
.stage .kicker{font-size:2.6vh;font-weight:900;color:#ffcc33;letter-spacing:.08em;text-transform:uppercase}
.stage .grow{flex:1}
.side{background:rgba(255,255,255,.06);border-radius:3vh;padding:2.2vh 1.4vw;display:flex;flex-direction:column;gap:1.1vh;min-height:0;overflow:hidden}
.side h3{margin:0 0 .6vh;font-size:2.6vh;letter-spacing:.08em;text-transform:uppercase;color:#c3bdf0}
.side .rk{display:flex;align-items:center;gap:.9vw;padding:1vh .9vw;border-radius:1.8vh;background:rgba(255,255,255,.07);font-size:3.1vh;font-weight:800;transition:transform .3s}

/* ---------- Sons (synthétisés, aucun fichier) ---------- */
const Snd = {
  ctx:null,
  init(){
    if (!this.ctx){ try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(f, d=.12, type='sine', delay=0, vol=.15){
    if (!S.settings.sound || !this.ctx) return;
    try {
      const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + d + .05);
    } catch(e){}
  },
  tap(){ this.tone(660, .05, 'triangle', 0, .06); },
  tick(){ this.tone(880, .08, 'square', 0, .05); },
  buzz(){ this.tone(150, .5, 'sawtooth', 0, .12); },
  good(){ [523,659,784].forEach((f,i) => this.tone(f, .2, 'triangle', i*.1, .15)); },
  bad(){ [392,330,262].forEach((f,i) => this.tone(f, .25, 'sawtooth', i*.14, .07)); },
  fanfare(){ [523,659,784,1047,784,1047].forEach((f,i) => this.tone(f, .24, 'triangle', i*.12, .15)); },
  drum(){ for (let i = 0; i < 14; i++) this.tone(90 + rnd(30), .08, 'square', i*.11, .03 + .05*i/14); },
  count(){ this.tone(600, .15, 'sine', 0, .15); },
  go(){ this.tone(1000, .4, 'sine', 0, .18); }
};

/* ---------- Toast & confettis ---------- */
let toastT;
function toast(msg){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600);
}
function confetti(){
  const c = document.createElement('canvas'); c.className = 'confetti'; document.body.appendChild(c);
  const ctx = c.getContext('2d'), dpr = window.devicePixelRatio || 1, W = c.width = innerWidth*dpr, H = c.height = innerHeight*dpr;
  const cols = ['#ffcc33','#ff5d73','#4cc9f0','#3ddc97','#b388ff','#ffffff'];
  const ps = Array.from({length:160}, () => ({x:Math.random()*W, y:-Math.random()*H*.6, vx:(Math.random()-.5)*4*dpr, vy:(2+Math.random()*4)*dpr, r:(5+Math.random()*7)*dpr, a:Math.random()*6, va:(Math.random()-.5)*.3, c:pick(cols)}));
  const t0 = performance.now();
  (function f(t){
    ctx.clearRect(0, 0, W, H);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .04*dpr; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r/2, -p.r/4, p.r, p.r/2); ctx.restore(); });
    if (t - t0 < 4500) requestAnimationFrame(f); else c.remove();
  })(t0);
}

/* nombre de rôles : réglage choisi, ajusté s'il n'y a pas assez de joueurs
   (il faut au moins 2 civils, et au moins autant de civils que d'intrus) */
function rolesCount(n){
  let under = S.settings.unders || (n >= 7 ? 2 : 1), white = S.settings.whites || 0;
  const ok = () => { const c = n - under - white; return c >= 2 && c >= under + white; };
  while (!ok() && white > 0) white--;
  while (!ok() && under > 1) under--;
  const wanted = (S.settings.unders || (n >= 7 ? 2 : 1)) + (S.settings.whites || 0);
  return {under, white, civil:n - under - white, adjusted:under + white < wanted};
}
const pairKey = (a, b) => [norm(a), norm(b)].sort().join('|');
function banPair(pair, on){
  const k = pairKey(pair.civil, pair.under);
  S.banned = S.banned.filter(x => x !== k); if (on) S.banned.push(k);
  store.set('banned', S.banned);
}
const isBanned = pair => !!pair && S.banned.includes(pairKey(pair.civil, pair.under));
function choosePair(){
  const lv = LEVELS[S.settings.level] || LEVELS.moyen;
  let pool = WORDS.filter(w => S.settings.themes[w.t] && lv.includes(w.l));
  if (S.settings.family) pool = pool.concat(S.custom.map(c => ({a:c.a, b:c.b, t:'famille', l:0})));
  const ban = new Set(S.banned);
  pool = pool.filter(w => !ban.has(pairKey(w.a, w.b)));
  if (!pool.length) pool = WORDS.filter(w => !ban.has(pairKey(w.a, w.b)));
  if (!pool.length) pool = WORDS.slice();
  const key = w => w.a + '|' + w.b;
  let fresh = pool.filter(w => !S.history.includes(key(w)));
  if (!fresh.length){ const keys = new Set(pool.map(key)); S.history = S.history.filter(k => !keys.has(k)); fresh = pool; }
  // les mots perso sortent plus souvent (environ 1 manche sur 3) pour ne pas être noyés dans la masse
  const freshCustom = fresh.filter(w => w.t === 'famille');
  const w = (freshCustom.length && Math.random() < .33) ? pick(freshCustom) : pick(fresh);
  S.history.push(key(w)); if (S.history.length > 400) S.history = S.history.slice(-400);
  store.set('history', S.history);
  const swap = Math.random() < .5;
  return {civil: swap ? w.b : w.a, under: swap ? w.a : w.b, t:w.t};
}
/* multi = true : un téléphone par joueur (ce téléphone est l'hôte de la salle) */
function startGame(list, multi){
  const players = (list || selPlayers()).map(p => ({id:p.id, name:p.name.trim(), emoji:p.emoji, color:p.color}));
  S.game = {
    id:uid(), started:Date.now(), round:0, players,
    total:S.settings.endMode === 'points' ? 0 : S.settings.rounds, goal:S.settings.endMode === 'points' ? S.settings.goal : 0,
    scores:Object.fromEntries(players.map(p => [p.id, 0])),
    underCount:Object.fromEntries(players.map(p => [p.id, 0])),
    log:[], done:false
  };
  S.game.cfg = {timer:S.settings.timer, lastChance:S.settings.lastChance, writtenClues:S.settings.writtenClues, detective:S.settings.detective};
  if (multi) Object.assign(S.game, {multi:true, code:S.net.code, hostMe:S.net.hostMe || null});
  else if (S.settings.tv && S.net){ S.game.tv = true; S.game.code = S.net.code; }
  startRound();
  S.view = 'game'; S.nav = []; S.modal = null;
  render();
}
/* redo = true : on rejoue la même manche avec de nouveaux mots, sans toucher aux points */
/* fin de partie : nombre de manches, ou premier à X points (garde-fou à 30 manches) */
const isLastRound = g => g.goal ? (Math.max(0, ...Object.values(g.scores)) >= g.goal || g.round >= 30) : g.round >= g.total;
const roundLbl = g => g.goal ? `Manche ${g.round} · 🎯 ${g.goal} pts` : `Manche ${g.round}/${g.total}`;
function startRound(redo){
  const g = S.game; if (!redo) g.round++;
  const seat = g.players.map(p => p.id), n = seat.length;
  const rc = rolesCount(n), roles = {};
  seat.forEach(id => roles[id] = 'civil');
  let pool = seat.slice();
  for (let i = 0; i < rc.under; i++){
    const id = weightedPick(pool, x => 1 / (1 + 1.5 * (g.underCount[x] || 0)));
    roles[id] = 'under'; pool = pool.filter(x => x !== id);
  }
  for (let i = 0; i < rc.white; i++){ const id = pick(pool); roles[id] = 'white'; pool = pool.filter(x => x !== id); }
  const start = (g.round - 1) % n;
  g.r = {
    pair:choosePair(), roles, alive:seat.slice(),
    distOrder:seat.slice(start).concat(seat.slice(0, start)), distIdx:0,
    phase:g.multi ? 'words' : 'pass', firstVoteDone:false, tieRound:false, clueRound:1, cluesNeeded:S.settings.clueRounds,
    order:[], idx:0, voteStep:'debate', elim:[], last:null, guessType:null, bonus:{}, result:null,
    nonce:uid(), ready:{}, votes:{}, voteId:null, lastVotes:null, tieIds:null, clues:[], tour:0, tally:null, flair:{}
  };
  S.ui.revealed = false;
  saveGame();
}
function wordOf(id){
  const r = S.game.r, role = r.roles[id];
  return role === 'white' ? null : (role === 'under' ? r.pair.under : r.pair.civil);
}
function startClues(){
  const r = S.game.r, base = r.alive.slice();
  let choices = base.filter(id => r.roles[id] !== 'white'); if (!choices.length) choices = base;
  const first = pick(choices), i = base.indexOf(first);
  r.order = base.slice(i).concat(base.slice(0, i));
  r.idx = 0; r.clueRound = 1; r.tour = (r.tour || 0) + 1;
  r.cluesNeeded = (r.tieRound || r.firstVoteDone) ? 1 : S.settings.clueRounds;
  r.phase = 'clues';
}
function goVote(){ const r = S.game.r; r.phase = 'vote'; r.voteStep = 'debate'; r.votes = {}; r.voteId = uid(); }
function submitGuess(txt){
  const g = S.game, r = g.r;
  S.ui.guessTxt = '';
  if (matchWord(txt, r.pair.civil)){
    (g.multi ? netToast : toast)(`✅ « ${txt} » : bonne réponse !`);
    return ACTIONS.guess({v:'yes'});
  }
  r.guessTxt = txt; Snd.buzz(); saveGame(); render();
}
function eliminate(id, quick){
  const g = S.game, r = g.r;
  r.alive = r.alive.filter(x => x !== id); r.elim.push(id); r.last = id;
  r.firstVoteDone = true; r.tieRound = false; r.tieIds = null;
  if (quick){   // le dépouillement a déjà fait monter le suspense
    r.phase = 'role'; S.modal = null; saveGame(); render();
    return r.roles[id] === 'civil' ? Snd.bad() : Snd.good();
  }
  r.phase = 'suspense'; S.modal = null;
  saveGame(); render(); Snd.drum();
  setTimeout(() => {
    if (S.game === g && g.r === r && r.phase === 'suspense'){
      r.phase = 'role'; saveGame(); render();
      r.roles[id] === 'civil' ? Snd.bad() : Snd.good();
    }
  }, 1800);
}
function checkWin(){
  const r = S.game.r;
  const civ = r.alive.filter(id => r.roles[id] === 'civil').length;
  const inf = r.alive.filter(id => r.roles[id] !== 'civil').length;
  if (inf === 0) return endRound('civils');
  if (civ <= 1) return endRound('inf');
  startClues(); saveGame(); render();
}
function endRound(winner){
  const g = S.game, r = g.r, pts = {}, won = {};
  g.players.forEach(p => pts[p.id] = 0);
  if (winner === 'civils') g.players.forEach(p => { if (r.roles[p.id] === 'civil'){ pts[p.id] += PTS.civil; won[p.id] = true; } });
  if (winner === 'inf') r.alive.forEach(id => { if (r.roles[id] !== 'civil'){ pts[id] += PTS[r.roles[id]]; won[id] = true; } });
  if (winner === 'white'){ pts[r.last] += PTS.white; won[r.last] = true; }
  for (const id in r.bonus) pts[id] += r.bonus[id];
  for (const id in (r.flair || {})) if (id in pts) pts[id] += r.flair[id];
  g.players.forEach(p => {
    g.scores[p.id] += pts[p.id];
    if (r.roles[p.id] === 'under') g.underCount[p.id]++;
  });
  g.log.push({n:g.round, civil:r.pair.civil, under:r.pair.under, t:r.pair.t, winner, roles:Object.assign({}, r.roles), pts, won, found:Object.keys(r.bonus), elim:r.elim.slice()});
  r.result = {winner, pts, won};
  r.phase = 'end';
  saveGame(); render();
  winner === 'civils' ? Snd.good() : Snd.fanfare();
}
function gameRecord(g){
  return {
    id:g.id, date:g.ended || Date.now(), started:g.started || null, total:g.total, played:g.log.length,
    settings:{level:S.settings.level, unders:S.settings.unders, whites:S.settings.whites, goal:g.goal || 0, lastChance:S.settings.lastChance},
    players:g.players.map(p => ({id:p.id, name:p.name, emoji:p.emoji, color:p.color, score:g.scores[p.id]})),
    log:g.log
  };
}
function finishGame(){
  const g = S.game;
  if (!g.done){
    g.done = true; g.ended = Date.now();
    if (g.log.length){ S.games = S.games.filter(x => x.id !== g.id); S.games.push(gameRecord(g)); saveGames(); }
    saveGame();
  }
  S.view = 'podium'; S.modal = null; render();
  Snd.fanfare(); confetti();
}

/* ---------- Statistiques (recalculées depuis l'historique) ---------- */
const STAT_FIELDS = ['games','gameWins','rounds','roundWins','under','underWins','found'];
function computeStats(){
  const out = {};
  const get = name => {
    const k = String(name).trim().toLowerCase();
    if (!out[k]){ out[k] = {name:String(name).trim()}; STAT_FIELDS.forEach(f => out[k][f] = 0); }
    return out[k];
  };
  for (const k in S.legacyStats){ const ls = S.legacyStats[k]; if (!ls || !ls.name) continue; const s = get(ls.name); STAT_FIELDS.forEach(f => s[f] += +ls[f] || 0); }
  S.games.forEach(g => {
    const max = Math.max(...g.players.map(p => p.score));
    g.players.forEach(p => { const s = get(p.name); s.games++; if (p.score === max) s.gameWins++; });
    g.log.forEach(r => g.players.forEach(p => {
      if (!r.roles || !(p.id in r.roles)) return;
      const s = get(p.name);
      s.rounds++; if (r.won && r.won[p.id]) s.roundWins++;
      if (r.roles[p.id] === 'under'){ s.under++; if (r.won && r.won[p.id]) s.underWins++; }
      if (r.found && r.found.includes(p.id)) s.found++;
    }));
  });
  return out;
}

function exportData(){
  return {app:APP_ID, v:2, at:new Date().toISOString(), roster:S.roster, groups:S.groups, selection:S.selection, settings:S.settings, custom:S.custom, banned:S.banned, games:S.games, legacyStats:S.legacyStats};
}
const exportCode = () => 'UCF2:' + b64enc(JSON.stringify(exportData()));
function parseData(txt){
  let t = String(txt || '').trim();
  if (!t) throw new Error('Rien à importer : colle un code ou choisis un fichier');
  let json;
  if (t[0] === '{') json = t;
  else { try { json = b64dec(t.replace(/^UCF\d*:/, '').replace(/\s+/g, '')); } catch(e){ throw new Error('Code illisible : vérifie qu\'il est complet'); } }
  let o; try { o = JSON.parse(json); } catch(e){ throw new Error('Code illisible : vérifie qu\'il est complet'); }
  if (!o || o.app !== APP_ID) throw new Error('Ces données ne viennent pas d\'Undercover Famille');
  const arr = x => Array.isArray(x) ? x : [];
  return {
    roster:arr(o.roster).filter(p => p && p.name && String(p.name).trim()).map(cleanPlayer),
    selection:arr(o.selection).map(String),
    settings:o.settings && typeof o.settings === 'object' ? o.settings : null,
    custom:arr(o.custom).filter(c => c && c.a && c.b).map(c => ({a:String(c.a).slice(0, 30), b:String(c.b).slice(0, 30)})),
    games:arr(o.games).filter(g => g && g.id && Array.isArray(g.players) && Array.isArray(g.log)).map(g => Object.assign({}, g, {id:String(g.id), players:g.players.map(cleanPlayer).map((p, i) => Object.assign(p, {score:+g.players[i].score || 0}))})),
    legacyStats:o.legacyStats && typeof o.legacyStats === 'object' ? o.legacyStats : {},
    banned:arr(o.banned).map(String).filter(k => k.includes('|')).slice(0, 2000),
    groups:arr(o.groups).filter(g => g && g.name).map(cleanGroup).slice(0, 30)
  };
}
function mergeData(d){
  const added = {games:0, players:0, words:0};
  (d.groups || []).forEach(g => { if (!S.groups.some(x => x.id === g.id)) S.groups.push(g); });
  const names = new Set(S.roster.map(p => p.name.toLowerCase()));
  d.roster.forEach(p => {
    const k = p.name.toLowerCase();
    if (names.has(k)){   // même joueur : on réunit ses groupes
      const me = S.roster.find(x => x.name.toLowerCase() === k);
      if (me && p.groups) me.groups = Array.from(new Set((me.groups || []).concat(p.groups)));
      return;
    }
    names.add(k); S.roster.push(Object.assign({}, p, {id:S.roster.some(x => x.id === p.id) ? uid() : p.id})); added.players++;
  });
  const wk = new Set(S.custom.map(c => (c.a + '|' + c.b).toLowerCase()));
  d.custom.forEach(c => { const k = (c.a + '|' + c.b).toLowerCase(); if (!wk.has(k)){ wk.add(k); S.custom.push(c); added.words++; } });
  S.banned = Array.from(new Set(S.banned.concat(d.banned || []))); store.set('banned', S.banned);
  const gids = new Set(S.games.map(g => g.id));
  d.games.forEach(g => { if (!gids.has(g.id)){ gids.add(g.id); S.games.push(g); added.games++; } });
  S.games.sort((a,b) => a.date - b.date);
  if (!Object.keys(S.legacyStats).length && Object.keys(d.legacyStats).length) S.legacyStats = d.legacyStats;
  saveAll();
  return added;
}
function replaceData(d){
  if (d.roster.length) S.roster = d.roster;
  if (d.groups && d.groups.length) S.groups = d.groups;
  S.selection = d.selection.filter(id => S.roster.some(p => p.id === id));
  if (d.settings) S.settings = mergeSettings(d.settings);
  S.custom = d.custom; S.games = d.games.sort((a,b) => a.date - b.date); S.legacyStats = d.legacyStats;
  S.banned = d.banned || []; store.set('banned', S.banned);
  saveAll();
}

  catch(e){
    const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch(_){}
    ta.remove(); return ok;
  }
}

    else { await copyText(exportCode()); toast('Code copié ✓'); }

}
async function gistSync(){
  const token = (S.gist.token || '').trim();
  if (!token) return toast('Colle d\'abord ton jeton GitHub');
  if (S.ui.syncing) return;
  S.ui.syncing = true; render();
  const H = {Authorization:'Bearer ' + token, Accept:'application/vnd.github+json'};
  const api = 'https://api.github.com';
  const fail = res => { const e = new Error('http'); e.status = res.status; return e; };
  try {
    let id = (S.gist.id || '').trim(), remote = null;
    if (!id){
      const res = await fetch(api + '/gists?per_page=100', {headers:H});
      if (!res.ok) throw fail(res);
      const found = (await res.json()).find(g => g.files && g.files[GIST_FILE]);
      if (found) id = found.id;
    }
    if (id){
      const res = await fetch(api + '/gists/' + encodeURIComponent(id), {headers:H});
      if (res.status === 404) id = '';
      else {
        if (!res.ok) throw fail(res);
        const f = (await res.json()).files[GIST_FILE];
        if (f){ let txt = f.content; if (f.truncated && f.raw_url) txt = await (await fetch(f.raw_url)).text(); remote = parseData(txt); }
      }
    }
    const added = remote ? mergeData(remote) : null;
    const files = {[GIST_FILE]:{content:JSON.stringify(exportData(), null, 1)}};
    const res = await fetch(api + '/gists' + (id ? '/' + encodeURIComponent(id) : ''), {
      method:id ? 'PATCH' : 'POST', headers:Object.assign({'Content-Type':'application/json'}, H),
      body:JSON.stringify(id ? {files} : {description:'Undercover Famille — sauvegarde', public:false, files})
    });
    if (!res.ok) throw fail(res);
    S.gist.id = (await res.json()).id; S.gist.last = Date.now(); saveGist();
    toast(added ? `Synchronisé ✓ ${added.games ? '· ' + plural(added.games, 'partie') + ' récupérée' + (added.games > 1 ? 's' : '') : ''}` : 'Sauvegarde créée sur GitHub ✓');
  } catch(e){
    const st = e && e.status;
    toast(st === 401 ? 'Jeton invalide ou expiré' : st === 403 || st === 404 ? 'Accès refusé : le jeton doit avoir la permission « gist »' : st ? 'Erreur GitHub (' + st + ')' : (e && e.message && !/fetch|network/i.test(e.message) ? e.message : 'Impossible de joindre GitHub : vérifie la connexion'));
  }
  S.ui.syncing = false; render();
}

/* =========================================================
   Un téléphone par joueur (Supabase Realtime : Broadcast + Presence)
   ---------------------------------------------------------
   Le téléphone qui ouvre la salle est l'« hôte » : il garde la partie et
   applique les règles. Les autres envoient leurs actions (mot vu, indice
   donné, vote…) et reçoivent l'état public de la partie. Chacun reçoit son
   mot dans un message qui lui est adressé ; les votes restent cachés
   jusqu'au dépouillement. Rien n'est enregistré sur le serveur.

const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ';

  return /^https:\/\/[^\s/]+/.test(url) && key ? {url, key} : null;

/* --- transport Supabase --- */
let sbMod = null, sbClient = null, sbClientKey = '';
async function sbTransport(cfg, code, h){
  if (!sbMod) sbMod = await import(SB_CDN);
  const k = cfg.url + '|' + cfg.key;
  if (!sbClient || sbClientKey !== k){
    sbClient = sbMod.createClient(cfg.url, cfg.key, {auth:{persistSession:false, autoRefreshToken:false, detectSessionInUrl:false}});
    sbClientKey = k;
  }
  const ch = sbClient.channel('ucf-' + code, {config:{broadcast:{self:false, ack:true}, presence:{key:Net.cid}}});
  let meta = null, on = false;
  ch.on('broadcast', {event:'m'}, e => h.msg(e.payload))
    .on('presence', {event:'sync'}, () => {
      const st = ch.presenceState(), o = {};
      for (const key in st) o[key] = (st[key] && st[key][0]) || {};
      h.presence(o);
    })
    .subscribe(st => {
      if (st === 'SUBSCRIBED'){ on = true; if (meta) ch.track(meta).catch(() => {}); h.status('on'); }
      else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT'){ on = false; h.status('down'); }
      else if (st === 'CLOSED'){ on = false; h.status('off'); }
    });
  return {
    send:m => ch.send({type:'broadcast', event:'m', payload:m}),
    track:m => { meta = m; if (on) ch.track(m).catch(() => {}); },
    close:() => { on = false; try { sbClient.removeChannel(ch); } catch(e){} }
  };
}
/* --- transport local (tests : plusieurs onglets du même navigateur, ?local=1&p=nom) --- */
function localTransport(code, h){
  const bc = new BroadcastChannel('ucf-' + code), peers = {};
  let meta = {};
  const emit = () => { const o = {[Net.cid]:meta}; for (const k in peers) if (Date.now() - peers[k].at < 7000) o[k] = peers[k].meta; h.presence(o); };
  const hb = first => bc.postMessage({_hb:Net.cid, meta, first});
  bc.onmessage = e => {
    const d = e.data;
    if (d && d._hb){ peers[d._hb] = {meta:d.meta, at:Date.now()}; if (d.first) hb(false); emit(); return; }
    if (d && d._bye){ delete peers[d._bye]; emit(); return; }
    h.msg(d);
  };
  const iv = setInterval(() => { hb(false); emit(); }, 2000);
  setTimeout(() => { hb(true); h.status('on'); }, 30);
  return {
    send:m => bc.postMessage(JSON.parse(JSON.stringify(m))),
    track:m => { meta = m; hb(false); emit(); },
    close:() => { clearInterval(iv); try { bc.postMessage({_bye:Net.cid}); bc.close(); } catch(e){} }
  };
}

/* --- connexion --- */
const Net = {
  role:null, code:'', tr:null, status:'off', online:{}, onKey:'', tok:0, lastState:'', lastPriv:'', waitT:null,
  cid:store.get('cid', null) || (() => { const c = uid(); store.set('cid', c); return c; })(),
  async open(role, code){
    this.close();
    const cfg = sbConfig(); if (!cfg) throw new Error('nocfg');
    const tok = ++this.tok;
    Object.assign(this, {role, code, status:'connecting', online:{}, onKey:'', lastState:'', lastPriv:''});
    const guard = fn => (...a) => { if (tok !== this.tok) return; netRender = true; try { fn(...a); } catch(e){ console.error(e); } finally { netRender = false; } };
    const h = {
      msg:guard(m => { if (m && m.t) (role === 'host' ? hostMsg : role === 'tv' ? tvMsg : guestMsg)(m); }),
      presence:guard(o => {
        this.online = o;
        const k = Object.values(o).map(m => (m && m.pid || '') + (m && m.host ? '*' : '') + (m && m.tv ? '#' : '')).sort().join(',');
        if (k !== this.onKey){ this.onKey = k; render(); }
      }),
      status:guard(st => {
        const was = this.status; this.status = st;
        if (st === 'on'){ this.track(); (role === 'host' ? hostUp : role === 'tv' ? tvUp : guestUp)(); }
        if (was !== st) render();
      })
    };
    try { this.tr = cfg.local ? localTransport(code, h) : await sbTransport(cfg, code, h); }
    catch(e){ if (tok === this.tok){ this.status = 'down'; this.role = null; } throw e; }
  },
  track(){
    if (!this.tr) return;
    const pid = this.role === 'host' ? (S.net && S.net.hostMe) : (S.guest && S.guest.joined ? S.guest.me : null);
    this.tr.track({pid:this.role === 'tv' ? null : pid || null, host:this.role === 'host', tv:this.role === 'tv'});
  },
  send(m){
    if (!this.tr || this.status !== 'on') return false;
    try { const p = this.tr.send(m); if (p && p.catch) p.catch(() => {}); return true; } catch(e){ return false; }
  },
  close(){
    this.tok++; clearTimeout(this.waitT);
    if (this.tr){ try { this.tr.close(); } catch(e){} }
    Object.assign(this, {tr:null, role:null, code:'', status:'off', online:{}, onKey:''});
  },
  seen(){ return Object.keys(this.online).length > 1; },
  isOnline(pid){ return Object.values(this.online).some(m => m && m.pid === pid); },
  hostOnline(){ return Object.values(this.online).some(m => m && m.host); },
  tvOnline(){ return Object.values(this.online).some(m => m && m.tv); }
};

/* toutes les actions de partie passent par ici, qu'elles viennent de l'hôte ou d'un invité */
function hostAct(from, a, d, isHost){
  const g = S.game;
  if (!g || !g.multi || g.guest || g.done || !g.r) return;
  const r = g.r, inGame = !!from && g.players.some(p => p.id === from), who = from && P(from);
  switch (a){
    case 'seen':
      if (r.phase !== 'words' || !inGame || d.n !== r.nonce) return;
      r.ready[from] = true;
      if (g.players.every(p => r.ready[p.id])) startClues();
      break;
    case 'forceStart':
      if (!isHost || r.phase !== 'words') return;
      startClues(); break;
    case 'redo':
      if (!(inGame || isHost) || r.firstVoteDone || !['words','clues','vote'].includes(r.phase) || d.n !== r.nonce) return;
      startRound(true);
      netToast(`🔄 ${who ? who.name + ' a demandé' : 'Nouvelle paire :'} de nouveaux mots`);
      break;
    case 'clued': {
      const cur = r.order[r.idx];
      if (r.phase !== 'clues' || d.i !== r.idx || d.c !== r.clueRound || (from !== cur && !isHost)) return;
      let txt = '';
      if (gcfg('writtenClues') && from === cur){
        txt = String(d.txt || '').replace(/\s+/g, ' ').trim().slice(0, 40);
        if (!txt) return toastTo(from, '✍️ Écris ton indice avant de valider');
        const w = norm(wordOf(cur)), c = ' ' + norm(txt) + ' ';
        if (w && w.length > 2 && (c.includes(' ' + w + ' ') || c.includes(' ' + w + 's ') || c.includes(' ' + w + 'x ')))
          return toastTo(from, '🙊 Ton indice ne doit pas contenir ton mot !');
      }
      (r.clues = r.clues || []).push({id:cur, tour:r.tour || 1, txt});
      r.idx++;
      if (r.idx >= r.order.length){ if (r.clueRound < r.cluesNeeded){ r.clueRound++; r.idx = 0; r.tour = (r.tour || 1) + 1; } else goVote(); }
      break;
    }
    case 'skipvote':
      if (!isHost || r.phase !== 'clues') return;
      goVote(); break;
    case 'vote':
      if (r.phase !== 'vote' || d.v !== r.voteId || !r.alive.includes(from) || !r.alive.includes(d.id) || d.id === from) return;
      r.votes[from] = d.id;

      break;
    case 'closeVote':
      if (!isHost || r.phase !== 'vote' || !Object.keys(r.votes).length) return;
      return resolveVote();
    case 'afterRole':
      if (r.phase !== 'role' || d.l !== r.last) return;
      return ACTIONS.afterRole();
    case 'guess':
      if (r.phase !== 'guess' || d.l !== r.last || (from && from === r.last)) return;

      break;

      return ACTIONS.nextRound();
    case 'podium':

      return finishGame();
    default: return;
  }

async function guestConnect(data){

function guestUp(){

}
function guestLeave(closed){

function guestMsg(m){
  const G = S.guest; if (!G) return;
  switch (m.t){
    case 'lobby':
      clearTimeout(Net.waitT); G.lobby = m; G.err = '';
      if (G.joined && !m.started && !m.players.some(p => p.id === G.me)){
        G.joined = false; G.me = null; saveGuest(); Net.track(); toast('Tu ne fais plus partie de la salle');
        if (S.game && S.game.guest){ S.game = store.get('game', null); S.view = 'join'; }
      }
      render(); break;
    case 'joined':
      if (m.cid !== Net.cid) return;
      Object.assign(G, {me:m.me, prof:m.prof, joined:true}); saveGuest(); store.set('me', m.prof); Net.track();
      Snd.good(); render(); break;
    case 'joinErr':
      if (m.cid === Net.cid) toast(m.msg);
      break;
    case 'state': guestState(m.g); break;
    case 'priv':
      if (m.to === G.me){ S.priv = {n:m.n, w:m.w, white:!!m.white}; render(); }
      break;
    case 'toast': if (!m.to || m.to === G.me) toast(m.msg); break;
    case 'closed': guestLeave(true); toast('🚪 L\'hôte a fermé la salle'); break;
  }
}
function guestState(g){
  const G = S.guest; if (!G || !G.joined || !g || !g.players) return;
  clearTimeout(Net.waitT);
  if (!g.players.some(p => p.id === G.me)){
    G.watching = true;
    if (S.game && S.game.guest){ S.game = store.get('game', null); S.view = 'join'; }
    return render();
  }
  G.watching = false;
  const prev = S.game && S.game.guest && S.game.id === g.id ? S.game : null, pr = prev && prev.r, r = g.r;
  g.guest = true; S.game = g;
  if (g.done){
    if (!(prev && prev.done)){
      Snd.fanfare(); confetti();
      if (g.record && !S.games.some(x => x.id === g.id)){ S.games.push(g.record); saveGames(); }
    }
    S.modal = null; S.view = 'podium';
  } else {
    if (['join','podium','home','game'].includes(S.view)) S.view = 'game';
    if (r && (!pr || pr.phase !== r.phase || (prev && prev.round !== g.round))){
      if (S.modal && S.modal.type !== 'menu' && S.modal.type !== 'scores' && S.modal.type !== 'rules') S.modal = null;
      if (r.phase === 'suspense') Snd.drum();
      else if (r.phase === 'role') r.roles[r.last] === 'civil' ? Snd.bad() : Snd.good();
      else if (r.phase === 'end') (r.result && r.result.winner === 'civils') ? Snd.good() : Snd.fanfare();
    }
    if (r && r.phase === 'guess' && (!pr || pr.phase !== 'guess')){ S.ui.guessTxt = ''; }
    if (r && (!pr || r.nonce !== pr.nonce)){ S.ui.revealed = false; if (S.modal && S.modal.type === 'myCard') S.modal = null; }
  }
  render();
}

function tvState(g){
  clearTimeout(Net.waitT);
  if (S.tv){ S.tv.err = ''; S.tv.closed = false; }
  if (!g){ S.game = null; return render(); }
  const prev = S.game && S.game.guest && S.game.id === g.id ? S.game : null, pr = prev && prev.r, r = g.r;
  g.guest = true; S.game = g;
  if (g.done){ if (!(prev && prev.done)){ Snd.fanfare(); confetti(); } return render(); }
  if (r && pr){
    const changed = pr.phase !== r.phase || prev.round !== g.round;
    if (changed && r.phase === 'suspense') Snd.drum();
    else if (changed && r.phase === 'role') r.roles[r.last] === 'civil' ? Snd.bad() : Snd.good();
    else if (changed && r.phase === 'end') (r.result && r.result.winner === 'civils') ? Snd.good() : Snd.fanfare();
    else if (r.phase === 'clues' && (pr.idx !== r.idx || pr.phase !== 'clues')) Snd.tap();
    else if (r.phase === 'pass' && pr.distIdx !== r.distIdx) Snd.tap();
    if (r.phase === 'vote' && r.voteStep === 'count' && pr.voteStep !== 'count') tvCountdown(r.voteId);
  }
  render();
}
/* décompte « 3, 2, 1… montrez du doigt ! » rejoué sur la TV (mode un téléphone) */
let TVCD = null;
function tvCountdown(k){
  const seq = ['3', '2', '1', '👉 Montrez du doigt !'];
  TVCD = {k, i:0};
  const step = () => {
    if (!TVCD || TVCD.k !== k) return;
    TVCD.txt = seq[TVCD.i]; TVCD.go = TVCD.i === 3;
    TVCD.go ? Snd.go() : Snd.count(); render();
    TVCD.i++;
    setTimeout(() => { if (!TVCD || TVCD.k !== k) return; if (TVCD.i < seq.length) step(); else { TVCD = null; render(); } }, TVCD.i === 4 ? 1500 : 800);
  };
  step();
}

      return `<h1>${title}</h1>${words}${pts}${feed ? feed.replace('class="feed"', 'class="feed two"') : ''}`;

}
function tvPodium(g){
  const list = rankList(g.players.map(p => Object.assign({}, p, {score:g.scores[p.id]})));
  const stepH = (x, pos) => x ? `<div class="step s${pos}">${av(x, pos === 1 ? 'l' : '')}<div class="nm">${nm(x)}</div><div class="block">${medal(x.rank)}<small>${x.score} pts</small></div></div>` : '<div class="step"></div>';
  const ties = list.filter(x => x.rank === 1);
  return `<div style="font-size:10vh">🏆</div><h1>${ties.length > 1 ? 'Égalité au sommet !' : `Bravo ${nm(list[0])} !`}</h1>
    <p class="muted">${plural(g.log.length, 'manche')} jouée${g.log.length > 1 ? 's' : ''}</p>
    <div class="podium">${stepH(list[1], 2)}${stepH(list[0], 1)}${stepH(list[2], 3)}</div>`;
}

/* ---------- QR code (chargé à la demande) ---------- */
let qrMod = null;
const QRS = {};   // url -> svg ('' si indisponible)
async function makeQR(url){
  if (url in QRS) return; QRS[url] = '';
  try {
    if (!qrMod) qrMod = (await import(QR_CDN)).default;
    const q = qrMod(0, 'M'); q.addData(url); q.make();
    QRS[url] = q.createSvgTag({cellSize:4, margin:2, scalable:true});
  } catch(e){}
  document.querySelectorAll('[data-qr]').forEach(el => { if (el.dataset.qr === url) el.innerHTML = QRS[url]; });
}
const qrBox = (url, cls) => `<div class="qr ${cls || ''}" data-qr="${esc(url)}">${QRS[url] || ''}</div>`;

    const g = S.game, r = g.r; r.voteStep = 'count'; render();

      const el = document.getElementById('cd');
      if (!el || S.game !== g || r.voteStep !== 'count') return;
      if (i < seq.length){
        el.innerHTML = `<span class="${i === 3 ? 'go' : ''}">${seq[i]}</span>`;

        setTimeout(step, i === 4 ? 1400 : 800);

/* choix du groupe qui joue (réglages, Qui joue ?, salle) */
function groupSeg(){
  return `<div class="set"><label>Groupe qui joue</label>${seg('group', [['', '👥 Tous']].concat(S.groups.map(g => [g.id, g.icon + ' ' + esc(g.name)])))}
    <div class="note">${curGroup() ? `Seuls les joueurs du groupe ${groupLbl(curGroup())} sont proposés${S.settings.mode === 'multi' ? ', aussi dans le « Qui es-tu ? » des téléphones' : ''}.` : 'Tous les joueurs enregistrés sont proposés.'}</div></div>`;
}
function seg(k, opts){
  return `<div class="seg">${opts.map(([v,l]) => `<button class="${S.settings[k] === v ? 'on' : ''}" data-a="set" data-k="${k}" data-v="${esc(JSON.stringify(v))}">${l}</button>`).join('')}</div>`;
}
function settingsSummary(n){
  const s = S.settings; if (n == null) n = S.selection.length;
  const rc = rolesCount(Math.max(n, MIN_P));
  const roles = n >= MIN_P ? `${rc.civil} civils · ${rc.under} Undercover${rc.under > 1 ? 's' : ''}${rc.white ? ` · ${rc.white} Mr White` : ''}` : `Choisis au moins ${MIN_P} joueurs`;
  return `<b>${roles}</b>${n >= MIN_P && rc.adjusted ? '<br><span class="small" style="color:#ffcc33">⚠️ Intrus réduits : pas assez de joueurs pour le réglage choisi</span>' : ''}<br><span class="muted small">Mots ${LEVEL_LBL[s.level].toLowerCase()} · ${s.clueRounds} tour${s.clueRounds > 1 ? 's' : ''} d'indices · ${s.endMode === 'points' ? 'premier à ' + s.goal + ' points' : s.rounds + ' manches'} · ${s.timer ? 'minuteur ' + s.timer + ' s' : 'sans minuteur'}</span>`;
}
function holdCard(id, w){
  const p = P(id); if (w === undefined) w = wordOf(id);
  const inner = w === null

function bannedLabel(k){
  const all = WORDS.map(w => [w.a, w.b]).concat(S.custom.map(c => [c.a, c.b]));

  return f ? f[0] + ' / ' + f[1] : k.replace('|', ' / ');
}

function rankList(players){
  const list = players.slice().sort((a,b) => b.score - a.score);
  list.forEach(x => x.rank = 1 + list.filter(y => y.score > x.score).length);
  return list;
}

/* fil des indices : une ligne par joueur, ses indices dans l'ordre des tours */
function clueFeed(r, reveal){
  const list = r.clues || []; if (!list.length) return '';
  const ids = (r.order && r.order.length ? r.order : []).concat(r.elim || []).filter((id, i, a) => a.indexOf(id) === i);
  S.game.players.forEach(p => { if (!ids.includes(p.id)) ids.push(p.id); });
  const lastIdx = list.length - 1;
  const rows = ids.map(id => {
    const mine = list.map((c, i) => Object.assign({i}, c)).filter(c => c.id === id);
    if (!mine.length) return '';
    const role = reveal ? r.roles[id] : null;
    return `<div class="fr ${r.alive.includes(id) ? '' : 'out'} ${role && role !== 'civil' ? role : ''}"><span class="who">${av(PP(id), 's')}${nm(PP(id))}</span>
      <span class="cl">${mine.map(c => `<span class="ct ${c.txt ? '' : 'voice'} ${c.i === lastIdx && !reveal ? 'new' : ''}">${c.txt ? esc(c.txt) : '🎤'}</span>`).join('')}</span>
      ${role ? `<span class="rl" title="${ROLE[role].lbl}">${ROLE[role].emo}</span>` : ''}</div>`;
  }).join('');
  return `<div class="feed">${rows}</div>`;
}
/* dépouillement : qui a voté pour qui */
function votesHtml(r){
  const lv = r.lastVotes || {}, by = {};
  for (const v in lv) (by[lv[v]] = by[lv[v]] || []).push(v);
  const ids = Object.keys(by).sort((a, b) => by[b].length - by[a].length);
  if (!ids.length) return '';
  return `<div class="card"><div class="sec" style="margin:0 0 8px">🗳️ Les votes</div><div class="sl">${ids.map(id =>
    `<div class="si">${av(PP(id), 's')}<span class="n">${nm(PP(id))}</span><span class="vt">${by[id].map(v => av(PP(v), 's')).join('')}</span><span class="p">${by[id].length}</span></div>`).join('')}</div></div>`;
}

function vMTally(){

        <button class="btn ghost" data-a="home">🏠 Accueil <small>(partie sauvegardée)</small></button>
        <button class="btn ghost" data-a="modal" data-v="quit">🛑 Abandonner la partie</button>
        <button class="btn primary" data-a="closeModal">Fermer</button>`;
      break;
    }
    case 'scores': {
      const list = g.players.slice().sort((a,b) => g.scores[b.id] - g.scores[a.id]);
      body = `<h2>📊 Scores — ${roundLbl(g).toLowerCase()}</h2>
        <div class="sl">${list.map(p => `<div class="si">${av(p, 's')}<span class="n">${nm(p)}</span><span class="p">${g.scores[p.id]}</span></div>`).join('')}</div>
        <button class="btn primary" data-a="closeModal">Fermer</button>`;
      break;
    }
    case 'rules': body = `${rulesHtml()}<button class="btn primary" data-a="closeModal">Fermer</button>`; break;
    case 'redo': body = `<div class="center" style="gap:6px"><div style="font-size:3rem">🔄</div></div>` + yesNo('Changer de mots ?', 'Un mot pas compris, ou une paire déjà jouée ? La manche recommence avec une nouvelle paire de mots. Les rôles sont retirés au sort et <b>les points ne changent pas</b>.', 'redoYes', '🔄 Changer', 'primary'); break;
    case 'endNow': body = yesNo('Terminer la partie maintenant ?', `Le classement est arrêté après ${plural(g.log.length, 'manche')} et la partie est enregistrée dans l'historique.${r && r.phase !== 'end' ? ' La manche en cours ne compte pas.' : ''}`, 'endNowYes', '🏁 Terminer', 'primary'); break;
    case 'quit': body = yesNo('Abandonner la partie ?', 'Les scores de cette partie seront perdus et elle n\'ira pas dans l\'historique.', 'quitYes', 'Oui, abandonner'); break;
    case 'replace': body = yesNo('Une partie est en cours', 'En commencer une nouvelle effacera la partie en cours.', m.yes || 'replaceYes', 'Nouvelle partie', 'primary'); break;
    case 'myCard': {
      const me = ME(), w = myWord();
      body = w === undefined || !me ? `<p class="center muted">Ton mot n'est pas encore arrivé…</p><button class="btn primary" data-a="closeModal">Fermer</button>`
        : `${holdCard(me, w)}<button class="btn primary" data-a="closeModal">C'est bon, j'ai vu ✓</button>`;
      break;
    }
    case 'mRedo': body = `<div class="center" style="gap:6px"><div style="font-size:3rem">🔄</div></div>` + yesNo('Changer de mots ?', 'Un mot pas compris, ou une paire déjà jouée ? La manche recommence pour tout le monde avec une nouvelle paire. Les rôles sont retirés au sort et <b>les points ne changent pas</b>.', 'mRedoYes', '🔄 Changer', 'primary'); break;
    case 'closeVote': body = yesNo('Clôturer le vote ?', 'Le dépouillement se fera avec les votes déjà reçus (utile si un téléphone est déconnecté).', 'mCloseVoteYes', 'Clôturer', 'primary'); break;
    case 'room': body = `<h2>📲 Salle de jeu</h2>${roomCard(roomCode())}<p class="muted small">Quelqu'un a fermé le jeu par erreur ? Il le rouvre : il retrouve la partie tout seul, ou via « Rejoindre une partie » avec ce code.</p><button class="btn primary" data-a="closeModal">Fermer</button>`; break;
    case 'tvlink': {
      const code = roomCode();
      body = code ? `<h2>📺 Écran TV</h2>
        <p class="muted small">Sur l'appareil relié à la TV (iPad recopié, ordinateur, navigateur de la TV) : ouvre le jeu et touche <b>« 📺 Afficher sur la TV »</b>, puis tape le code. Ou scanne ce QR code avec l'iPad.</p>
        <div class="code">${code.split('').map(c => `<span>${c}</span>`).join('')}</div>
        <div class="center">${qrBox(tvLink(code))}</div>
        <p class="center small">${Net.role === 'host' && Net.tvOnline() ? '🟢 TV connectée' : Net.status === 'on' ? '⚪ En attente de la TV…' : '🟠 Connexion…'}</p>
        <div class="row"><button class="btn ghost" data-a="tvShare">📤 Envoyer le lien</button><button class="btn ghost" data-a="tvCopy">📋 Copier</button></div>
        <button class="btn primary" data-a="closeModal">Fermer</button>`
        : `<p class="muted">La salle n'est pas encore ouverte.</p><button class="btn primary" data-a="closeModal">Fermer</button>`;
      break;
    }
    case 'closeRoom': body = yesNo('Fermer la salle ?', 'Les joueurs connectés seront déconnectés' + (S.game && S.game.multi && !S.game.done ? ' et la partie en cours sera abandonnée.' : '.'), 'closeRoomYes', 'Fermer la salle'); break;
    case 'leaveRoom': body = yesNo('Quitter la salle ?', 'Tu pourras revenir avec le même code.', 'mLeaveYes', 'Quitter'); break;
    case 'resetStats': body = yesNo('Tout effacer ?', 'L\'historique des parties et toutes les statistiques seront supprimés de cet appareil.', 'resetStatsYes', 'Effacer'); break;
    case 'delGame': body = yesNo('Supprimer cette partie ?', 'Elle disparaîtra de l\'historique et des statistiques.', 'delGameYes', 'Supprimer'); break;
    case 'gistForget': body = yesNo('Oublier le jeton ?', 'Le jeton GitHub sera effacé de cet appareil. Tes données restent sur GitHub.', 'gistForgetYes', 'Oublier'); break;
    case 'groups': body = `<h2>⚙️ Groupes</h2>
        <p class="muted small">Touche l'icône pour la changer, le nom pour le modifier.</p>
        <div class="sl">${S.groups.map(g => `<div class="si"><button class="mini" style="font-size:1.2rem" data-a="grIcon" data-g="${esc(g.id)}" aria-label="Changer l'icône">${g.icon}</button>
          <input data-field="gname" data-g="${esc(g.id)}" value="${esc(g.name)}" maxlength="20" autocomplete="off" style="flex:1">
          <span class="muted small">${S.roster.filter(p => (p.groups || []).includes(g.id)).length}</span>
          <button class="mini" data-a="grDel" data-g="${esc(g.id)}" aria-label="Supprimer">✕</button></div>`).join('')}</div>
        <div class="row"><input id="grn" placeholder="Nouveau groupe (ex. Foot, Voisins)" maxlength="20" autocomplete="off" enterkeyhint="done"><button class="btn primary" style="width:auto;flex:none" data-a="grAdd">＋</button></div>
        <button class="btn primary" data-a="closeModal">Terminé</button>`; break;
    case 'grDel': { const g = S.groups.find(x => x.id === m.g); body = yesNo(`Supprimer le groupe ${g ? groupLbl(g) : ''} ?`, 'Les joueurs ne sont pas supprimés : ils quittent seulement ce groupe.', 'grDelYes', 'Supprimer'); break; }
    case 'rDel': { const p = S.roster.find(x => x.id === m.id); body = yesNo(`Supprimer ${p ? nm(p) : 'ce joueur'} ?`, 'Il ne sera plus proposé au début des parties. L\'historique est conservé.', 'rDelYes', 'Supprimer'); break; }
    case 'newPlayer': body = `<h2>＋ Nouveau joueur</h2>
        <input id="np" placeholder="Prénom" maxlength="16" autocomplete="off" enterkeyhint="done">
        <p class="muted small">Il sera enregistré pour les prochaines parties.</p>
        <div class="row"><button class="btn ghost" data-a="closeModal">Annuler</button><button class="btn primary" data-a="npAdd">Ajouter</button></div>`; break;
    case 'impChoice': {
      const d = S.ui.imp;
      body = `<h2>📥 Données trouvées</h2>
        <div class="card"><b>${plural(d.games.length, 'partie')} · ${plural(d.roster.length, 'joueur')} · ${plural(d.custom.length, 'paire')} perso</b></div>
        <button class="btn primary" data-a="impMerge">🔀 Fusionner avec mes données</button>
        <p class="muted small">Ajoute les parties, joueurs et mots qui manquent. Rien n'est effacé.</p>
        <button class="btn red" data-a="impReplace">♻️ Tout remplacer</button>
        <p class="muted small">Les données de cet appareil sont remplacées par celles importées (la partie en cours est conservée).</p>
        <button class="btn ghost" data-a="closeModal">Annuler</button>`;
      break;
    }
    case 'confirmElim': {
      const p = P(m.id);
      body = `<div class="center" style="gap:8px">${av(p, 'l')}<h2>Éliminer ${nm(p)} ?</h2></div>
        <div class="row"><button class="btn ghost" data-a="closeModal">Annuler</button><button class="btn red" data-a="confirmElim">Éliminer</button></div>`;
      break;
    }
    case 'peekWho': body = `<h2>🤫 Qui veut revoir son mot ?</h2>
        <div class="grid">${r.alive.map(id => { const p = P(id); return `<button class="pcard" data-a="peekWho" data-id="${esc(id)}">${av(p, 'l')}${nm(p)}</button>`; }).join('')}</div>
        <button class="btn ghost" data-a="closeModal">Annuler</button>`; break;
    case 'peekPass': {
      const p = P(m.id);
      body = `<div class="center" style="gap:8px"><p class="muted">Passe le téléphone à</p>${av(p, 'l')}<h2>${nm(p)}</h2><p class="muted small">Les autres, on ne regarde pas ! 🙈</p></div>
        <button class="btn primary" data-a="peekGo">C'est moi, ${nm(p)} !</button><button class="btn ghost" data-a="closeModal">Annuler</button>`;
      break;
    }
    case 'peekCard': body = `${holdCard(m.id)}<button class="btn primary" data-a="closeModal">C'est bon, j'ai vu ✓</button>`; break;
  }
  return `<div class="modal-bg" data-a="bgClose"><div class="modal" role="dialog">${body}</div></div>`;
}

/* =========================================================
   Rendu & minuteur
   ========================================================= */
let lastKey = '', renderPending = false;
function render(){
  pushState();   // hôte : envoie l'état aux autres téléphones s'il a changé
  if (holdEl){ renderPending = true; return; }   // ne pas cacher un mot pendant qu'on le regarde
  renderPending = false;
  const views = {home:vHome, players:vPlayers, roster:vRoster, settings:vSettings, words:vWords, rules:vRules, stats:vStats,
    history:vHistory, gameDetail:vGameDetail, export:vExport, import:vImport, gist:vGist, game:vGame, podium:vPodium,
    lobby:vLobby, join:vJoin, online:vOnline, tv:vTv};
  document.body.classList.toggle('tvmode', S.view === 'tv' && !!S.tv);
  if ((S.view === 'game' || S.view === 'podium') && !S.game) S.view = 'home';
  // un message réseau ne doit pas faire perdre la saisie en cours
  const ae = document.activeElement, keep = netRender && ae && ae.id && /^(INPUT|TEXTAREA)$/.test(ae.tagName) ? {id:ae.id, v:ae.value, a:ae.selectionStart, b:ae.selectionEnd} : null;
  app.innerHTML = (views[S.view] || vHome)() + vModal();
  if (keep){ const el = document.getElementById(keep.id); if (el){ el.value = keep.v; el.focus(); try { el.setSelectionRange(keep.a, keep.b); } catch(e){} } }
  const key = S.view + (S.game && S.game.r ? S.game.r.phase + S.game.round : '');
  if (key !== lastKey){ window.scrollTo(0, 0); lastKey = key; }
  if (S.modal && S.modal.type === 'newPlayer'){ const el = $('#np'); if (el) el.focus(); }
  document.querySelectorAll('[data-qr]').forEach(el => { if (!(el.dataset.qr in QRS)) makeQR(el.dataset.qr); });
  syncTimer(); syncTally(); hostTallyWatch(); turnAlerts();
  wake(['game','lobby','join','tv'].includes(S.view));
}
let T = null;
function timerKey(){
  const g = S.game; if (!g || !(S.view === 'game' || S.view === 'tv') || !gset('timer') || !g.r) return null;
  const r = g.r; if (r.phase !== 'clues') return null;
  return [g.id, g.round, r.order.join(','), r.clueRound, r.idx, r.tieRound ? 't' : ''].join('|');
}
/* dépouillement : un bulletin de plus toutes les TALLY_STEP ms, sur chaque écran */
const vibrate = pat => { if (S.settings.vibrate !== false && navigator.vibrate) try { navigator.vibrate(pat); } catch(e){} };
/* alerte quand l'écran de ce téléphone attend quelque chose de son joueur */
let alertKey = '';
function turnAlerts(){
  const g = S.game, r = g && g.r; if (!g || !g.multi || g.done || S.view !== 'game' || !r) return;
  const me = ME(); if (!me) return;
  let k = '';
  if (r.phase === 'clues' && r.order[r.idx] === me) k = 'clue|' + clueKey();
  else if (r.phase === 'vote' && r.alive.includes(me)) k = 'vote|' + r.voteId;
  else if (r.phase === 'guess' && r.last === me && !r.guessTxt) k = 'guess|' + r.nonce + '|' + r.last;
  if (!k || k === alertKey) return;
  alertKey = k;
  if (k.startsWith('clue') || k.startsWith('guess')){ vibrate([90, 60, 90]); Snd.go(); } else vibrate(60);
}
let TA = null;
function syncTally(){
  const g = S.game, r = g && g.r, t = r && r.phase === 'tally' && (S.view === 'game' || S.view === 'tv') ? r.tally : null;
  if (TA && (!t || TA.k !== t.id)){ clearInterval(TA.iv); TA = null; }
  if (!t || TA) return;
  if (!S.ui.tally || S.ui.tally.k !== t.id) S.ui.tally = {k:t.id, n:0};
  if (S.ui.tally.n >= t.order.length) return;
  TA = {k:t.id, iv:setInterval(() => {
    const u = S.ui.tally; if (!u || u.k !== t.id){ clearInterval(TA.iv); TA = null; return; }
    u.n++; Snd.tick();
    if (u.n >= t.order.length){ clearInterval(TA.iv); TA = null; setTimeout(() => { t.res ? Snd.drum() : Snd.buzz(); vibrate(t.res ? [40, 40, 40, 40, 160] : 120); }, 350); }
    render();
  }, TALLY_STEP)};
}
function syncTimer(){
  const k = timerKey();
  if (T && T.key !== k){ clearInterval(T.iv); T = null; }
  if (k && !T){
    const t = {key:k, left:gset('timer'), tot:gset('timer')};
    t.iv = setInterval(() => {
      t.left--;
      if (T === t){ if (t.left > 0 && t.left <= 5) Snd.tick(); if (t.left === 0) Snd.buzz(); paintTimer(); }
      if (t.left <= 0) clearInterval(t.iv);
    }, 1000);
    T = t;
  }
  paintTimer();
}
function paintTimer(){
  const el = document.getElementById('timer'); if (!el || !T) return;
  const left = Math.max(0, T.left), L = 2 * Math.PI * 40;
  el.querySelector('.t').textContent = left > 0 ? left : '⏰';
  el.querySelector('.ring').style.strokeDashoffset = L * (1 - left / T.tot);
  el.classList.toggle('over', left <= 0);
}

/* =========================================================
   Événements
   ========================================================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.a]; if (!fn) return;
  Snd.init(); if (el.dataset.a !== 'bgClose') Snd.tap();
  fn(el.dataset, el, e);
});
document.addEventListener('input', e => {
  const t = e.target, f = t.dataset && t.dataset.field;
  if (f === 'impTxt') S.ui.impTxt = t.value;
  else if (f === 'gistToken'){ S.gist.token = t.value.trim(); saveGist(); }
  else if (f === 'gistId'){ S.gist.id = t.value.trim(); saveGist(); }
  else if (f === 'joinCode'){ const c = cleanCode(t.value); if (t.value !== c) t.value = c; S.ui.joinCode = c; }
  else if (f === 'joinName') S.ui.joinName = t.value;
  else if (f === 'guessTxt') S.ui.guessTxt = t.value;
  else if (f === 'tvCode'){ const c = cleanCode(t.value); if (t.value !== c) t.value = c; S.ui.tvCode = c; }
  else if (f === 'clueTxt'){ S.ui.clueTxt = t.value; S.ui.clueKey = clueKey(); }
  else if (f === 'sbUrl' || f === 'sbKey'){ S.sb[f === 'sbUrl' ? 'url' : 'key'] = t.value.trim(); store.set('sb', S.sb); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'impFile' && t.files && t.files[0]){
    t.files[0].text().then(txt => { S.ui.impTxt = txt; render(); toast('Fichier chargé ✓ Touche « Importer »'); }).catch(() => toast('Fichier illisible'));
  }
  if (t.dataset && t.dataset.field === 'gname'){
    const g = S.groups.find(x => x.id === t.dataset.g), v = t.value.trim().slice(0, 20);
    if (g && v){ g.name = v; saveRoster(); }
  }
  if (t.dataset && t.dataset.field === 'rname'){
    const p = S.roster.find(x => x.id === t.dataset.id); if (!p) return;
    const v = t.value.trim().slice(0, 16);
    if (!v){ toast('Le prénom ne peut pas être vide'); return render(); }
    if (S.roster.some(x => x.id !== p.id && x.name.toLowerCase() === v.toLowerCase())){ toast(`${v} existe déjà`); return render(); }
    p.name = v; saveRoster();
  }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const id = e.target.id;
  if (id === 'wa'){ e.preventDefault(); $('#wb').focus(); }
  else if (id === 'wb'){ e.preventDefault(); ACTIONS.addWord(); }
  else if (id === 'np'){ e.preventDefault(); ACTIONS.npAdd(); }
  else if (id === 'rn'){ e.preventDefault(); ACTIONS.rAdd(); }
  else if (id === 'grn'){ e.preventDefault(); ACTIONS.grAdd(); }
  else if (id === 'jcode'){ e.preventDefault(); ACTIONS.joinGo(); }
  else if (id === 'jname'){ e.preventDefault(); ACTIONS.joinName(); }
  else if (id === 'clueIn'){ e.preventDefault(); ACTIONS.mClued(); }
  else if (id === 'guessIn'){ e.preventDefault(); ACTIONS.guessType(); }
  else if (id === 'tvcode'){ e.preventDefault(); ACTIONS.tvGo(); }
  else if (e.target.dataset && (e.target.dataset.field === 'rname' || e.target.dataset.field === 'gname')) e.target.blur();
});
/* carte « maintiens pour voir » */
let holdEl = null;
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('[data-hold]'); if (!h) return;
  e.preventDefault(); Snd.init();
  holdEl = h; h.classList.add('on');
  try { h.setPointerCapture(e.pointerId); } catch(_){}
  vibrate(25);
  S.ui.revealed = true;
  const b = document.getElementById('seenBtn'); if (b) b.disabled = false;
});
const releaseHold = () => {
  if (holdEl){ holdEl.classList.remove('on'); holdEl = null; }
  if (renderPending){ netRender = true; try { render(); } finally { netRender = false; } }
};
document.addEventListener('pointerup', releaseHold);
document.addEventListener('pointercancel', releaseHold);
window.addEventListener('blur', releaseHold);
document.addEventListener('contextmenu', e => { if (e.target.closest('[data-hold]')) e.preventDefault(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return releaseHold();
  if (['game','lobby','join','tv'].includes(S.view)){ wakeLock = null; wake(true); }
  // retour sur l'appli : on resynchronise
  if (Net.status === 'on'){ if (Net.role === 'guest') guestUp(); else if (Net.role === 'tv') tvUp(); else if (Net.role === 'host') pushState(true); }
});

/* hors ligne (GitHub Pages / https uniquement) */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* un téléphone par joueur : lien d'invitation (?salle=ABCD) et reconnexion automatique */
(function initNet(){
  const code = cleanCode(QS.get('salle')), sbp = QS.get('sb'), tvc = cleanCode(QS.get('tv'));
  if (sbp && !SUPABASE_URL){
    try { const [url, key] = b64dec(sbp).split('|'); if (/^https:\/\//.test(url) && key){ S.sb = {url, key}; store.set('sb', S.sb); } } catch(e){}
  }
  if (QS.has('salle') || QS.has('sb') || QS.has('tv')){
    const u = new URL(location.href); u.searchParams.delete('salle'); u.searchParams.delete('sb'); u.searchParams.delete('tv');
    try { history.replaceState(null, '', u.pathname + u.search + u.hash); } catch(e){}
  }
  if (S.game && (S.game.multi || S.game.tv) && !S.game.done && !S.net) S.net = {code:S.game.code, hostMe:S.game.hostMe || null, players:S.game.multi ? S.game.players.slice() : [], single:!S.game.multi};
  if (S.net && !(S.game && (S.game.multi || S.game.tv) && !S.game.done) && !recent(S.net.at)){ S.net = null; saveRoom(); }
  const tvSaved = store.get('tvRoom', null);
  if (tvc) tvConnect(tvc);
  else if (!code && tvSaved && recent(tvSaved.at)) tvConnect(tvSaved.code);
  else if (code){
    if (S.net && S.net.code === code){ S.view = 'lobby'; hostConnect(); }
    else if (savedGuest && savedGuest.code === code) guestConnect(savedGuest);
    else { S.ui.joinCode = code; if (sbConfig()) guestConnect({code}); else S.view = 'join'; }
  }
  else if (S.net) hostConnect();
  else if (savedGuest && savedGuest.joined && recent(savedGuest.at)) guestConnect(savedGuest);
})();

render();
</script>
