  maison:'lit/canapé/1;fourchette/cuillère/1;douche/baignoire/1;frigo/four/1;chaise/tabouret/1;télé/ordinateur/1;porte/fenêtre/1;assiette/bol/1;verre/tasse/1;oreiller/couverture/2;lampe/bougie/2;brosse à dents/peigne/2;savon/shampoing/2;balai/aspirateur/2;table/bureau/2;escalier/ascenseur/2;grenier/cave/2;clé/cadenas/2;réveil/horloge/2;casserole/poêle/3;rideau/volet/3;robinet/évier/3;armoire/commode/3;couette/drap/3;coussin/oreiller/3;garage/abri de jardin/3',
  ecole:'crayon/stylo/1;gomme/taille-crayon/1;cahier/livre/1;cartable/trousse/1;ciseaux/colle/1;récré/cantine/1;règle/équerre/2;tableau/écran/2;dictée/poésie/2;maîtresse/directrice/2;calculatrice/ordinateur/2;devoirs/leçons/2;cour de récré/préau/2;feutre/surligneur/3;compas/rapporteur/3;classeur/pochette/3;bulletin/carnet de liaison/3;addition/multiplication/3;sortie scolaire/classe verte/3',

  voyage:'avion/train/1;voiture/bus/1;plage/piscine/1;tente/caravane/1;valise/sac à dos/1;mer/lac/1;bateau/sous-marin/1;camping/hôtel/2;montagne/colline/2;zoo/ferme/2;cinéma/théâtre/2;parc d\'attractions/fête foraine/2;île/désert/2;carte/boussole/2;passeport/billet/2;mer/océan/3;train/métro/3;bus/car/3;ville/village/3;avion/hélicoptère/3;rivière/fleuve/3;château/palais/3;phare/tour/3',
  nature:'soleil/lune/1;pluie/neige/1;arbre/fleur/1;étoile/planète/1;nuage/arc-en-ciel/1;été/hiver/1;volcan/montagne/2;orage/tempête/2;forêt/jungle/2;rivière/cascade/2;feuille/branche/2;sable/galet/2;printemps/automne/2;hiver/automne/3;tempête/ouragan/3;étoile/comète/3;colline/dune/3;brouillard/nuage/3;grotte/tunnel/3;glacier/banquise/3',

  loisirs:'poupée/peluche/1;toboggan/balançoire/1;guitare/piano/1;dessin/peinture/1;puzzle/jeu de société/1;console/tablette/1;trompette/flûte/2;livre/bande dessinée/2;cerf-volant/avion en papier/2;cartes/dés/2;bulles de savon/ballon de baudruche/2;déguisement/maquillage/2;film/dessin animé/2;violon/violoncelle/3;batterie/tambour/3;cache-cache/chat perché/3;marionnette/poupée/3;photo/vidéo/3;trampoline/château gonflable/3',
  vetements:'bonnet/casquette/1;chaussettes/chaussons/1;baskets/bottes/1;écharpe/gants/1;jupe/robe/1;short/maillot de bain/1;pull/gilet/2;pyjama/peignoir/2;manteau/imperméable/2;lunettes/montre/2;ceinture/bretelles/2;collier/bracelet/2;pull/sweat/3;sandales/tongs/3;moufles/gants/3;chemise/tee-shirt/3;bague/boucle d\'oreille/3;chapeau/béret/3'
};
const WORDS = [];
for (const t in RAW) RAW[t].split(';').forEach(s => { const [a,b,l] = s.split('/'); WORDS.push({a,b,l:+l,t}); });

const EMOJIS = ['🦊','🐼','🐸','🦁','🐙','🦄','🐯','🐨','🐵','🐧','🐻','🐰','🐲','🦉','🐳','🦖'];
const COLORS = ['#ff5d73','#4cc9f0','#3ddc97','#ffcc33','#b388ff','#ff9f43','#f72585','#2ec4b6'];
const ROLE = {
  civil:{lbl:'CIVIL',emo:'🙂',cls:'b-civil'},
  under:{lbl:'UNDERCOVER',emo:'🕵️',cls:'b-under'},
  white:{lbl:'MR WHITE',emo:'🎩',cls:'b-white'}
};
const LEVELS = {facile:[1],moyen:[1,2],difficile:[2,3],mix:[1,2,3]};
const LEVEL_LBL = {facile:'Facile',moyen:'Moyen',difficile:'Difficile',mix:'Mélange'};
const PTS = {civil:2, under:6, white:6, lastChance:3};

/* ---------- Outils ---------- */
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const uid = () => Math.random().toString(36).slice(2, 10);
const store = {
  get(k, d){ try { const v = localStorage.getItem('ucf_' + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('ucf_' + k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem('ucf_' + k); } catch(e){} }
};
function weightedPick(items, w){
  const ws = items.map(w), tot = ws.reduce((a,b)=>a+b, 0);
  let x = Math.random() * tot;
  for (let i = 0; i < items.length; i++){ x -= ws[i]; if (x <= 0) return items[i]; }
  return items[items.length - 1];
}

/* ---------- État ---------- */
const DEFAULT_SETTINGS = {
  level:'moyen', clueRounds:2, timer:0, rounds:5, mrWhite:false, lastChance:true, sound:true, family:true,
  themes:Object.fromEntries(Object.keys(THEMES).map(k => [k, true]))
};
function defaultPlayers(){
  return [1,2,3,4].map(i => ({id:uid(), name:'Joueur ' + i, emoji:EMOJIS[i-1], color:COLORS[i-1]}));
}
const loadedSettings = store.get('settings', {});
const S = {
  view:'home', back:'home', modal:null, ui:{},
  players: store.get('players', null) || defaultPlayers(),
  settings: Object.assign({}, DEFAULT_SETTINGS, loadedSettings, {themes:Object.assign({}, DEFAULT_SETTINGS.themes, loadedSettings.themes || {})}),
  custom: store.get('custom', []),
  history: store.get('history', []),
  stats: store.get('stats', {}),
  game: store.get('game', null)
};
if (S.game && S.game.r){
  const r = S.game.r;
  if (r.phase === 'reveal') r.phase = 'pass';
  if (r.phase === 'suspense') r.phase = 'role';
  if (r.voteStep === 'count') r.voteStep = 'pick';
}

/* ---------- Sons (synthétisés, aucun fichier) ---------- */
const Snd = {
  ctx:null,
  init(){
    if (!this.ctx){ try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(f, d=.12, type='sine', delay=0, vol=.15){
    if (!S.settings.sound || !this.ctx) return;
    try {
      const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + d + .05);
    } catch(e){}
  },
  tap(){ this.tone(660, .05, 'triangle', 0, .06); },
  tick(){ this.tone(880, .08, 'square', 0, .05); },
  buzz(){ this.tone(150, .5, 'sawtooth', 0, .12); },
  good(){ [523,659,784].forEach((f,i) => this.tone(f, .2, 'triangle', i*.1, .15)); },
  bad(){ [392,330,262].forEach((f,i) => this.tone(f, .25, 'sawtooth', i*.14, .07)); },
  fanfare(){ [523,659,784,1047,784,1047].forEach((f,i) => this.tone(f, .24, 'triangle', i*.12, .15)); },
  drum(){ for (let i = 0; i < 14; i++) this.tone(90 + rnd(30), .08, 'square', i*.11, .03 + .05*i/14); },
  count(){ this.tone(600, .15, 'sine', 0, .15); },
  go(){ this.tone(1000, .4, 'sine', 0, .18); }
};

/* ---------- Écran toujours allumé pendant la partie ---------- */
let wakeLock = null;
async function wake(on){
  try {
    if (on && 'wakeLock' in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); }
    if (!on && wakeLock){ await wakeLock.release(); wakeLock = null; }
  } catch(e){}
}

/* ---------- Toast & confettis ---------- */
let toastT;
function toast(msg){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2400);
}
function confetti(){
  const c = document.createElement('canvas'); c.className = 'confetti'; document.body.appendChild(c);
  const ctx = c.getContext('2d'), dpr = window.devicePixelRatio || 1, W = c.width = innerWidth*dpr, H = c.height = innerHeight*dpr;
  const cols = ['#ffcc33','#ff5d73','#4cc9f0','#3ddc97','#b388ff','#ffffff'];
  const ps = Array.from({length:160}, () => ({x:Math.random()*W, y:-Math.random()*H*.6, vx:(Math.random()-.5)*4*dpr, vy:(2+Math.random()*4)*dpr, r:(5+Math.random()*7)*dpr, a:Math.random()*6, va:(Math.random()-.5)*.3, c:pick(cols)}));
  const t0 = performance.now();
  (function f(t){
    ctx.clearRect(0, 0, W, H);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .04*dpr; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r/2, -p.r/4, p.r, p.r/2); ctx.restore(); });
    if (t - t0 < 4500) requestAnimationFrame(f); else c.remove();
  })(t0);
}

/* =========================================================
   Logique de jeu
   ========================================================= */
function rolesCount(n){
  const under = n >= 7 ? 2 : 1;
  const white = (S.settings.mrWhite && n >= 4) ? 1 : 0;
  return {under, white, civil:n - under - white};
}
function choosePair(){
  const lv = LEVELS[S.settings.level] || LEVELS.moyen;
  let pool = WORDS.filter(w => S.settings.themes[w.t] && lv.includes(w.l));
  if (S.settings.family) pool = pool.concat(S.custom.map(c => ({a:c.a, b:c.b, t:'famille', l:0})));
  if (!pool.length) pool = WORDS.slice();
  const key = w => w.a + '|' + w.b;
  let fresh = pool.filter(w => !S.history.includes(key(w)));
  if (!fresh.length){ const keys = new Set(pool.map(key)); S.history = S.history.filter(k => !keys.has(k)); fresh = pool; }
  // les mots perso sortent plus souvent (environ 1 manche sur 3) pour ne pas être noyés dans la masse
  const freshCustom = fresh.filter(w => w.t === 'famille');
  const w = (freshCustom.length && Math.random() < .33) ? pick(freshCustom) : pick(fresh);
  S.history.push(key(w)); if (S.history.length > 400) S.history = S.history.slice(-400);
  store.set('history', S.history);
  const swap = Math.random() < .5;
  return {civil: swap ? w.b : w.a, under: swap ? w.a : w.b, t:w.t};
}
function startGame(){
  const players = S.players.map(p => ({...p, name:p.name.trim()}));
  S.game = {
    id:uid(), round:0, total:S.settings.rounds, players,
    scores:Object.fromEntries(players.map(p => [p.id, 0])),
    underCount:Object.fromEntries(players.map(p => [p.id, 0])),
    done:false, statsDone:false
  };
  startRound();
  S.view = 'game'; S.modal = null;
  render();
}
function startRound(){
  const g = S.game; g.round++;
  const seat = g.players.map(p => p.id), n = seat.length;
  const rc = rolesCount(n), roles = {};
  seat.forEach(id => roles[id] = 'civil');
  let pool = seat.slice();
  for (let i = 0; i < rc.under; i++){
    const id = weightedPick(pool, x => 1 / (1 + 1.5 * (g.underCount[x] || 0)));
    roles[id] = 'under'; pool = pool.filter(x => x !== id);
  }
  for (let i = 0; i < rc.white; i++){ const id = pick(pool); roles[id] = 'white'; pool = pool.filter(x => x !== id); }
  const start = (g.round - 1) % n;
  g.r = {
    pair:choosePair(), roles, alive:seat.slice(),
    distOrder:seat.slice(start).concat(seat.slice(0, start)), distIdx:0,
    phase:'pass', firstVoteDone:false, clueRound:1, cluesNeeded:S.settings.clueRounds,
    order:[], idx:0, candidates:null, voteStep:'debate', tieSel:[],
    elim:[], last:null, guessType:null, bonus:{}, result:null
  };
  saveGame();
}
function wordOf(id){
  const r = S.game.r, role = r.roles[id];
  return role === 'white' ? null : (role === 'under' ? r.pair.under : r.pair.civil);
}
function startClues(){
  const r = S.game.r;
  const base = r.candidates ? r.alive.filter(id => r.candidates.includes(id)) : r.alive.slice();
  let choices = base.filter(id => r.roles[id] !== 'white'); if (!choices.length) choices = base;
  const first = pick(choices), i = base.indexOf(first);
  r.order = base.slice(i).concat(base.slice(0, i));
  r.idx = 0; r.clueRound = 1;
  r.cluesNeeded = r.candidates ? 1 : (r.firstVoteDone ? 1 : S.settings.clueRounds);
  r.phase = 'clues';
}
function goVote(){ const r = S.game.r; r.phase = 'vote'; r.voteStep = 'debate'; }
function eliminate(id){
  const g = S.game, r = g.r;
  r.alive = r.alive.filter(x => x !== id); r.elim.push(id); r.last = id;
  r.firstVoteDone = true; r.candidates = null; r.tieSel = [];
  r.phase = 'suspense'; S.modal = null;
  saveGame(); render(); Snd.drum();
  setTimeout(() => {
    if (S.game === g && g.r === r && r.phase === 'suspense'){
      r.phase = 'role'; saveGame(); render();
      r.roles[id] === 'civil' ? Snd.bad() : Snd.good();
    }
  }, 1800);
}
function checkWin(){
  const r = S.game.r;
  const civ = r.alive.filter(id => r.roles[id] === 'civil').length;
  const inf = r.alive.filter(id => r.roles[id] !== 'civil').length;
  if (inf === 0) return endRound('civils');
  if (civ <= 1) return endRound('inf');
  startClues(); saveGame(); render();
}
function endRound(winner){
  const g = S.game, r = g.r, pts = {};
  g.players.forEach(p => pts[p.id] = 0);
  const won = {};
  if (winner === 'civils') g.players.forEach(p => { if (r.roles[p.id] === 'civil'){ pts[p.id] += PTS.civil; won[p.id] = true; } });
  if (winner === 'inf') r.alive.forEach(id => { if (r.roles[id] !== 'civil'){ pts[id] += PTS[r.roles[id]]; won[id] = true; } });
  if (winner === 'white'){ pts[r.last] += PTS.white; won[r.last] = true; }
  for (const id in r.bonus) pts[id] += r.bonus[id];
  g.players.forEach(p => {
    g.scores[p.id] += pts[p.id];
    if (r.roles[p.id] === 'under') g.underCount[p.id]++;
    const s = st(p.name);
    s.rounds++; if (won[p.id]) s.roundWins++;
    if (r.roles[p.id] === 'under'){ s.under++; if (won[p.id]) s.underWins++; }
    if (r.bonus[p.id]) s.found++;
  });
  saveStats();
  r.result = {winner, pts, won};
  r.phase = 'end';
  saveGame(); render();
  winner === 'civils' ? Snd.good() : Snd.fanfare();
}
function st(name){
  const k = name.trim().toLowerCase();
  if (!S.stats[k]) S.stats[k] = {name:name.trim(), games:0, gameWins:0, rounds:0, roundWins:0, under:0, underWins:0, found:0};
  S.stats[k].name = name.trim();
  return S.stats[k];
}
function finishGame(){
  const g = S.game;
  if (!g.statsDone){
    const max = Math.max(...Object.values(g.scores));
    g.players.forEach(p => { const s = st(p.name); s.games++; if (g.scores[p.id] === max) s.gameWins++; });
    g.statsDone = true; g.done = true; saveStats(); saveGame();
  }
  S.view = 'podium'; render();
  Snd.fanfare(); confetti();
}

/* =========================================================
   Actions (boutons data-a="...")
   ========================================================= */
const ACTIONS = {
  go(d){ if (d.v === 'settings') S.back = S.view; S.view = d.v; S.modal = null; render(); },
  resume(){ S.view = S.game.done ? 'podium' : 'game'; render(); },
  launch(){
    const names = S.players.map(p => p.name.trim());
    if (names.some(n => !n)) return toast('Donne un prénom à chaque joueur ✏️');
    const low = names.map(n => n.toLowerCase());
    if (new Set(low).size !== low.length) return toast('Deux joueurs ont le même prénom');
    if (S.game && !S.game.done){ S.modal = {type:'replace'}; return render(); }
    startGame();
  },
  replaceYes(){ startGame(); },
  emoji(d){
    const p = S.players[+d.i], used = S.players.map(x => x.emoji);
    let i = EMOJIS.indexOf(p.emoji);
    for (let k = 0; k < EMOJIS.length; k++){ i = (i + 1) % EMOJIS.length; if (!used.includes(EMOJIS[i])) break; }
    p.emoji = EMOJIS[i]; savePlayers(); render();
  },
  addP(){
    if (S.players.length >= 8) return;
    const ue = S.players.map(p => p.emoji), uc = S.players.map(p => p.color);
    S.players.push({id:uid(), name:'', emoji:EMOJIS.find(e => !ue.includes(e)) || pick(EMOJIS), color:COLORS.find(c => !uc.includes(c)) || pick(COLORS)});
    savePlayers(); S.ui.focusLast = true; render();
  },
  delP(d){ if (S.players.length <= 3) return; S.players.splice(+d.i, 1); savePlayers(); render(); },
  moveUp(d){ const i = +d.i; if (i < 1) return; [S.players[i-1], S.players[i]] = [S.players[i], S.players[i-1]]; savePlayers(); render(); },
  set(d){ S.settings[d.k] = JSON.parse(d.v); saveSettings(); render(); },
  theme(d){
    const th = S.settings.themes, on = Object.values(th).filter(Boolean).length;
    if (th[d.k] && on <= 1) return toast('Garde au moins un thème');
    th[d.k] = !th[d.k]; saveSettings(); render();
  },
  addWord(){
    const a = ($('#wa').value || '').trim(), b = ($('#wb').value || '').trim();
    if (!a || !b) return toast('Remplis les deux mots');
    if (a.toLowerCase() === b.toLowerCase()) return toast('Les deux mots doivent être différents');
    S.custom.push({a, b}); store.set('custom', S.custom); render();
    setTimeout(() => { const el = $('#wa'); if (el) el.focus(); }, 0);
    toast('Paire ajoutée ✓');
  },
  delWord(d){ S.custom.splice(+d.i, 1); store.set('custom', S.custom); render(); },
  resetStats(){ S.modal = {type:'resetStats'}; render(); },
  resetStatsYes(){ S.stats = {}; saveStats(); S.modal = null; render(); toast('Statistiques remises à zéro'); },

  /* --- partie --- */
  iam(){ S.game.r.phase = 'reveal'; S.ui.revealed = false; render(); },
  seen(){
    const r = S.game.r; r.distIdx++;
    if (r.distIdx >= r.distOrder.length) startClues(); else r.phase = 'pass';
    saveGame(); render();
  },
  clued(){
    const r = S.game.r; r.idx++;
    if (r.idx >= r.order.length){
      if (r.clueRound < r.cluesNeeded){ r.clueRound++; r.idx = 0; } else goVote();
    }
    saveGame(); render();
  },
  skipvote(){ goVote(); saveGame(); render(); },
  countdown(){
    const g = S.game, r = g.r; r.voteStep = 'count'; render();
    const seq = ['3','2','1','👉 Montrez du doigt !']; let i = 0;
    const step = () => {
      const el = document.getElementById('cd');
      if (!el || S.game !== g || r.voteStep !== 'count') return;
      if (i < seq.length){
        el.innerHTML = `<span class="${i === 3 ? 'go' : ''}">${seq[i]}</span>`;
        i === 3 ? Snd.go() : Snd.count(); i++;
        setTimeout(step, i === 4 ? 1400 : 800);
      } else { r.voteStep = 'pick'; saveGame(); render(); }
    };
    step();
  },
  pickElim(d){ S.modal = {type:'confirmElim', id:d.id}; render(); },
  confirmElim(){ eliminate(S.modal.id); },
  tie(){ const r = S.game.r; r.voteStep = 'tie'; r.tieSel = []; render(); },
  tieToggle(d){ const r = S.game.r; r.tieSel = r.tieSel.includes(d.id) ? r.tieSel.filter(x => x !== d.id) : r.tieSel.concat(d.id); render(); },
  tieGo(){ const r = S.game.r; if (r.tieSel.length < 2) return; r.candidates = r.tieSel.slice(); r.tieSel = []; startClues(); saveGame(); render(); },
  tieCancel(){ S.game.r.voteStep = 'pick'; render(); },
  drawLots(){ const r = S.game.r; Snd.drum(); S.modal = {type:'drawn', id:pick(r.candidates)}; render(); },
  afterRole(){
    const r = S.game.r, role = r.roles[r.last];
    if (role === 'white'){ r.phase = 'guess'; r.guessType = 'white'; saveGame(); return render(); }
    if (role === 'under' && S.settings.lastChance){ r.phase = 'guess'; r.guessType = 'under'; saveGame(); return render(); }
    checkWin();
  },
  guess(d){
    const r = S.game.r, yes = d.v === 'yes';
    if (r.guessType === 'white'){ if (yes) return endRound('white'); Snd.bad(); return checkWin(); }
    if (yes){ r.bonus[r.last] = (r.bonus[r.last] || 0) + PTS.lastChance; toast(`+${PTS.lastChance} points pour ${P(r.last).name} !`); } else Snd.bad();
    checkWin();
  },
  nextRound(){ startRound(); render(); },
  podium(){ finishGame(); },
  rematch(){ S.game = null; startGame(); },
  home(){ S.game = null; saveGame(); S.view = 'home'; render(); },

  /* --- fenêtres --- */
  menu(){ S.modal = {type:'menu'}; render(); },
  modal(d){ S.modal = {type:d.v}; render(); },
  closeModal(){ S.modal = null; render(); },
  bgClose(d, el, e){ if (e.target === el){ S.modal = null; render(); } },
  toggleSound(){ S.settings.sound = !S.settings.sound; saveSettings(); render(); },
  quitYes(){ S.game = null; saveGame(); S.modal = null; S.view = 'home'; render(); },
  peek(){ S.modal = {type:'peekWho'}; render(); },
  peekWho(d){ S.modal = {type:'peekPass', id:d.id}; render(); },
  peekGo(){ S.modal = {type:'peekCard', id:S.modal.id}; render(); }
};

/* --- écrans de partie --- */
function vGame(){
  const r = S.game.r;
  switch (r.phase){
    case 'pass': return vPass();
    case 'reveal': return vReveal();
    case 'clues': return vClues();
    case 'vote': return vVote();
    case 'suspense': return vSuspense();
    case 'role': return vRole();
    case 'guess': return vGuess();
    case 'end': return vEnd();
  }
  return '';
}
function vPass(){
  const r = S.game.r, p = P(r.distOrder[r.distIdx]);
  return `<div class="screen">${topbar()}
    <div class="center grow">
      <p class="muted">Passe le téléphone à</p>
      <div style="margin:14px 0">${av(p, 'xl')}</div>
      <h1>${nm(p)}</h1>
      <p class="muted small" style="margin-top:8px">Les autres, on ne regarde pas ! 🙈</p>
    </div>
    <button class="btn primary big" data-a="iam">C'est moi, ${nm(p)} !</button>
    <p class="tip">Distribution des mots : ${r.distIdx + 1} / ${r.distOrder.length}</p>
  </div>`;
}
function vReveal(){
  const r = S.game.r, id = r.distOrder[r.distIdx], p = P(id);
  return `<div class="screen">
    <div class="center" style="gap:8px">${av(p)}<h2>${nm(p)}, à toi de voir !</h2></div>
    ${holdCard(id)}
    <p class="tip">Retiens bien ton mot, puis passe le téléphone au suivant.</p>
    <div class="grow"></div>
    <button id="seenBtn" class="btn primary big" data-a="seen" ${S.ui.revealed ? '' : 'disabled'}>J'ai retenu mon mot ✓</button>
  </div>`;
}
function vClues(){
  const r = S.game.r, p = P(r.order[r.idx]);
  const head = r.candidates ? `⚖️ Départage : un indice chacun` : `Tour d'indices ${r.clueRound} / ${r.cluesNeeded}`;
  return `<div class="screen">${topbar()}
    <p class="center muted" style="font-weight:800">${head}</p>
    <div class="center grow" style="gap:6px">
      ${av(p, 'xl')}
      <h1>${nm(p)}</h1>
      <p class="muted">donne un indice sur son mot</p>
      ${S.settings.timer ? `<div class="timer" id="timer" style="margin-top:10px"><svg width="90" height="90" viewBox="0 0 90 90"><circle cx="45" cy="45" r="40" stroke="rgba(255,255,255,.15)" stroke-width="8" fill="none"/><circle class="ring" cx="45" cy="45" r="40" stroke="#ffcc33" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="251.33" stroke-dashoffset="0"/></svg><div class="t">${S.settings.timer}</div></div>` : ''}
    </div>
    <div class="queue">${r.order.map((id,i) => av(P(id), 's ' + (i === r.idx ? 'cur' : i < r.idx ? 'done' : ''))).join('')}</div>
    <button class="btn primary big" data-a="clued">Indice donné ✓</button>
    <div class="row"><button class="btn ghost" data-a="peek">🤫 Revoir mon mot</button><button class="btn ghost" data-a="skipvote">🗳️ Voter</button></div>
    <p class="tip">💡 Pas trop précis… pas trop vague !</p>
  </div>`;
}
function vVote(){
  const r = S.game.r;
  const cands = r.candidates ? r.alive.filter(id => r.candidates.includes(id)) : r.alive;
  if (r.voteStep === 'debate' || r.voteStep === 'count'){
    return `<div class="screen">${topbar()}
      <div class="center grow" style="gap:10px">
        <div style="font-size:4rem">🗳️</div>
        <h1>Place au vote !</h1>
        <p class="muted">Discutez : qui semble avoir un mot différent ?</p>
        <div class="queue" style="margin-top:10px">${cands.map(id => av(P(id))).join('')}</div>
      </div>
      <button class="btn primary big" data-a="countdown">3, 2, 1… montrez du doigt ! 👉</button>
      <button class="btn ghost" data-a="peek">🤫 Revoir mon mot</button>
      ${r.voteStep === 'count' ? '<div class="cd" id="cd"></div>' : ''}
    </div>`;
  }
  if (r.voteStep === 'tie'){
    return `<div class="screen">${topbar()}
      <h2 class="center">⚖️ Qui est à égalité ?</h2>
      <p class="muted center small">Sélectionne les joueurs qui ont reçu le plus de doigts.</p>
      <div class="grid">${cands.map(id => { const p = P(id); return `<button class="pcard ${r.tieSel.includes(id) ? 'sel' : ''}" data-a="tieToggle" data-id="${id}">${av(p, 'l')}${nm(p)}</button>`; }).join('')}</div>
      <div class="grow"></div>
      <button class="btn primary" data-a="tieGo" ${r.tieSel.length < 2 ? 'disabled' : ''}>Départager : un indice de plus chacun</button>
      <button class="btn ghost" data-a="tieCancel">Retour</button>
    </div>`;
  }
  return `<div class="screen">${topbar()}
    <h2 class="center">👉 Qui a été désigné ?</h2>
    <p class="muted center small">Touche le joueur qui a reçu le plus de doigts.</p>
    <div class="grid">${cands.map(id => { const p = P(id); return `<button class="pcard" data-a="pickElim" data-id="${id}">${av(p, 'l')}${nm(p)}</button>`; }).join('')}</div>
    <div class="grow"></div>
    <button class="btn ghost" data-a="tie">⚖️ Il y a égalité</button>
    ${r.candidates ? `<button class="btn ghost" data-a="drawLots">🎲 Encore égalité : tirage au sort</button>` : ''}
  </div>`;
}
function vSuspense(){
  const p = P(S.game.r.last);
  return `<div class="screen"><div class="center grow" style="gap:12px">
    ${av(p, 'xl')}<h1>${nm(p)}</h1><p class="muted" style="font-size:1.2rem">était…</p>
    <div class="qmark shake">❓</div>
  </div></div>`;
}
function vRole(){
  const r = S.game.r, p = P(r.last), role = r.roles[r.last], R = ROLE[role];
  const msg = {
    civil:'Oups, un innocent ! L\'intrus court toujours…',

  if (role === 'white') btn = `<button class="btn primary big" data-a="afterRole">🎩 Mr White tente sa chance</button>`;
  else if (role === 'under' && S.settings.lastChance) btn = `<button class="btn primary big" data-a="afterRole">🎯 Dernière chance !</button>`;
  return `<div class="screen">${topbar()}
    <div class="center grow" style="gap:12px">
      ${av(p, 'xl')}<h1>${nm(p)}</h1><p class="muted" style="font-size:1.2rem">était</p>
      <div class="badge ${R.cls}">${R.emo} ${R.lbl}</div>
      <p style="margin-top:10px;font-size:1.1rem">${msg}</p>
    </div>
    ${btn}
  </div>`;
}
function vGuess(){
  const r = S.game.r, p = P(r.last), white = r.guessType === 'white';
  return `<div class="screen">${topbar()}
    <div class="center grow" style="gap:12px">
      <div style="font-size:3.5rem">${white ? '🎩' : '🎯'}</div>
      <h1>${white ? 'Mr White, à toi !' : 'Dernière chance !'}</h1>
      ${av(p, 'l')}
      <p style="font-size:1.15rem"><b>${nm(p)}</b>, quel est le mot des civils ?<br>Dis-le à voix haute !</p>
      <p class="muted">Les civils, est-ce que c'est le bon mot ?</p>
      <p class="pill">${white ? 'S\'il trouve, Mr White gagne la manche !' : `+${PTS.lastChance} points s'il trouve`}</p>
    </div>
    <div class="row"><button class="btn green big" data-a="guess" data-v="yes">✅ Trouvé</button><button class="btn red big" data-a="guess" data-v="no">❌ Raté</button></div>
  </div>`;
}
function vEnd(){
  const g = S.game, r = g.r, res = r.result;
  let title, sub;
  if (res.winner === 'civils'){ title = '🎉 Les civils gagnent !'; sub = 'L\'intrus a été démasqué.'; }
  else if (res.winner === 'white'){ title = '🎩 Mr White a trouvé !'; sub = 'Il a deviné le mot des civils.'; }
  else {
    const winners = r.alive.filter(id => r.roles[id] !== 'civil').map(id => r.roles[id]);
    if (winners.every(x => x === 'under')) title = winners.length > 1 ? '🕵️ Les Undercovers gagnent !' : '🕵️ L\'Undercover gagne !';
    else if (winners.every(x => x === 'white')) title = '🎩 Mr White gagne !';
    else title = '😈 Les intrus gagnent !';
    sub = winners.length > 1 ? 'Ils ont tenu jusqu\'au bout sans se faire prendre.' : 'Tenu jusqu\'au bout sans se faire prendre !';
  }
  const last = g.round >= g.total;
  const th = THEMES[r.pair.t];
  return `<div class="screen">${topbar()}
    <div class="center" style="gap:4px;margin-top:6px"><h1>${title}</h1><p class="muted">${sub}</p></div>
    <div class="words">
      <div class="c"><span class="muted small">Mot des civils</span><b>${esc(r.pair.civil)}</b></div>
      <div class="u"><span class="muted small">Mot de l'Undercover</span><b>${esc(r.pair.under)}</b></div>
    </div>
    <p class="tip">${th ? th.icon + ' ' + th.label : '✏️ Mes mots'}</p>
    <div class="sl">${g.players.map(p => {
      const pts = res.pts[p.id];
      return `<div class="si">${av(p, 's' + (r.alive.includes(p.id) ? '' : ' out'))}<span class="n">${nm(p)}</span><span class="role" title="${ROLE[r.roles[p.id]].lbl}">${ROLE[r.roles[p.id]].emo}</span>${pts ? `<span class="plus">+${pts}</span>` : '<span class="zero">+0</span>'}<span class="p">${g.scores[p.id]}</span></div>`;
    }).join('')}</div>
    <div class="grow"></div>
    ${last ? `<button class="btn primary big" data-a="podium">🏆 Voir le podium</button>`
           : `<button class="btn primary big" data-a="nextRound">Manche suivante (${g.round + 1}/${g.total}) ▶</button>`}
  </div>`;
}
function vPodium(){
  const g = S.game;
  const list = g.players.map(p => ({p, s:g.scores[p.id]})).sort((a,b) => b.s - a.s);
  list.forEach(x => x.rank = 1 + list.filter(y => y.s > x.s).length);
  const medal = rk => rk === 1 ? '🥇' : rk === 2 ? '🥈' : rk === 3 ? '🥉' : rk + 'e';
  const stepH = (x, pos) => x ? `<div class="step s${pos}">${av(x.p, pos === 1 ? 'l' : '')}<div class="nm">${nm(x.p)}</div><div class="block">${medal(x.rank)}<small>${x.s} pts</small></div></div>` : '<div class="step"></div>';
  const top = list[0], ties = list.filter(x => x.rank === 1);
  return `<div class="screen">
    <div class="center" style="gap:4px;margin-top:10px"><div style="font-size:3.5rem">🏆</div>
      <h1>${ties.length > 1 ? 'Égalité au sommet !' : `Bravo ${nm(top.p)} !`}</h1>
      <p class="muted">${g.total} manches jouées</p></div>
    <div class="podium">${stepH(list[1], 2)}${stepH(list[0], 1)}${stepH(list[2], 3)}</div>
    ${list.length > 3 ? `<div class="sl">${list.slice(3).map(x => `<div class="si"><span>${medal(x.rank)}</span>${av(x.p, 's')}<span class="n">${nm(x.p)}</span><span class="p">${x.s}</span></div>`).join('')}</div>` : ''}
    <div class="grow"></div>
    <button class="btn primary big" data-a="rematch">🔁 Revanche !</button>
    <button class="btn ghost" data-a="home">🏠 Accueil</button>
  </div>`;
}

/* --- fenêtres modales --- */
function vModal(){
  const m = S.modal; if (!m) return '';
  let body = '';
  const g = S.game, r = g && g.r;
  switch (m.type){
    case 'menu': {
      const canPeek = r && ['clues','vote'].includes(r.phase);
      body = `<h2>Menu</h2>
        <button class="btn ghost" data-a="modal" data-v="scores">📊 Scores</button>
        ${canPeek ? '<button class="btn ghost" data-a="peek">🤫 Revoir mon mot</button>' : ''}
        <button class="btn ghost" data-a="modal" data-v="rules">📖 Règles</button>
        <button class="btn ghost" data-a="toggleSound">${S.settings.sound ? '🔊 Son activé' : '🔇 Son coupé'}</button>
        <button class="btn ghost" data-a="go" data-v="home">🏠 Accueil <small>(partie sauvegardée)</small></button>
        <button class="btn ghost" data-a="modal" data-v="quit">🛑 Abandonner la partie</button>
        <button class="btn primary" data-a="closeModal">Fermer</button>`;
      break;
    }
    case 'scores': {
      const list = g.players.slice().sort((a,b) => g.scores[b.id] - g.scores[a.id]);
      body = `<h2>📊 Scores — manche ${g.round}/${g.total}</h2>
        <div class="sl">${list.map(p => `<div class="si">${av(p, 's')}<span class="n">${nm(p)}</span><span class="p">${g.scores[p.id]}</span></div>`).join('')}</div>
        <button class="btn primary" data-a="closeModal">Fermer</button>`;
      break;
    }
    case 'rules': body = `${rulesHtml()}<button class="btn primary" data-a="closeModal">Fermer</button>`; break;
    case 'quit': body = `<h2>Abandonner la partie ?</h2><p class="muted">Les scores de cette partie seront perdus.</p>
        <div class="row"><button class="btn ghost" data-a="closeModal">Non</button><button class="btn red" data-a="quitYes">Oui, abandonner</button></div>`; break;
    case 'replace': body = `<h2>Une partie est en cours</h2><p class="muted">En commencer une nouvelle effacera la partie en cours.</p>
        <div class="row"><button class="btn ghost" data-a="closeModal">Annuler</button><button class="btn primary" data-a="replaceYes">Nouvelle partie</button></div>`; break;
    case 'resetStats': body = `<h2>Remettre les stats à zéro ?</h2><p class="muted">Toutes les statistiques seront effacées.</p>
        <div class="row"><button class="btn ghost" data-a="closeModal">Annuler</button><button class="btn red" data-a="resetStatsYes">Effacer</button></div>`; break;
    case 'confirmElim': {
      const p = P(m.id);
      body = `<div class="center" style="gap:8px">${av(p, 'l')}<h2>Éliminer ${nm(p)} ?</h2></div>
        <div class="row"><button class="btn ghost" data-a="closeModal">Annuler</button><button class="btn red" data-a="confirmElim">Éliminer</button></div>`;
      break;
    }
    case 'drawn': {
      const p = P(m.id);
      body = `<div class="center" style="gap:8px"><div style="font-size:3rem">🎲</div><p class="muted">Le sort a désigné…</p>${av(p, 'l')}<h2>${nm(p)}</h2></div>
        <button class="btn red" data-a="confirmElim">Éliminer ${nm(p)}</button>`;
      break;
    }
    case 'peekWho': body = `<h2>🤫 Qui veut revoir son mot ?</h2>
        <div class="grid">${r.alive.map(id => { const p = P(id); return `<button class="pcard" data-a="peekWho" data-id="${id}">${av(p, 'l')}${nm(p)}</button>`; }).join('')}</div>
        <button class="btn ghost" data-a="closeModal">Annuler</button>`; break;
    case 'peekPass': {
      const p = P(m.id);
      body = `<div class="center" style="gap:8px"><p class="muted">Passe le téléphone à</p>${av(p, 'l')}<h2>${nm(p)}</h2><p class="muted small">Les autres, on ne regarde pas ! 🙈</p></div>
        <button class="btn primary" data-a="peekGo">C'est moi, ${nm(p)} !</button><button class="btn ghost" data-a="closeModal">Annuler</button>`;
      break;
    }
    case 'peekCard': body = `${holdCard(m.id)}<button class="btn primary" data-a="closeModal">C'est bon, j'ai vu ✓</button>`; break;
  }
  return `<div class="modal-bg" data-a="bgClose"><div class="modal" role="dialog">${body}</div></div>`;
}

/* =========================================================
   Rendu & minuteur
   ========================================================= */
let lastKey = '';
function render(){
  const views = {home:vHome, players:vPlayers, settings:vSettings, words:vWords, rules:vRules, stats:vStats, game:vGame, podium:vPodium};
  if ((S.view === 'game' || S.view === 'podium') && !S.game) S.view = 'home';
  app.innerHTML = (views[S.view] || vHome)() + vModal();
  const key = S.view + (S.game && S.game.r ? S.game.r.phase + S.game.round : '');
  if (key !== lastKey){ window.scrollTo(0, 0); lastKey = key; }
  if (S.ui.focusLast){ const ins = app.querySelectorAll('input[data-field="pname"]'); if (ins.length) ins[ins.length-1].focus(); S.ui.focusLast = false; }
  syncTimer();
  wake(S.view === 'game');
}
let T = null;
function timerKey(){
  const g = S.game; if (!g || S.view !== 'game' || !S.settings.timer) return null;
  const r = g.r; if (r.phase !== 'clues') return null;
  return [g.id, g.round, r.order.join(','), r.clueRound, r.idx, r.candidates ? 't' : ''].join('|');
}
function syncTimer(){
  const k = timerKey();
  if (T && T.key !== k){ clearInterval(T.iv); T = null; }
  if (k && !T){
    const t = {key:k, left:S.settings.timer, tot:S.settings.timer};
    t.iv = setInterval(() => {
      t.left--;
      if (T === t){ if (t.left > 0 && t.left <= 5) Snd.tick(); if (t.left === 0) Snd.buzz(); paintTimer(); }
      if (t.left <= 0) clearInterval(t.iv);
    }, 1000);
    T = t;
  }
  paintTimer();
}
function paintTimer(){
  const el = document.getElementById('timer'); if (!el || !T) return;
  const left = Math.max(0, T.left), L = 2 * Math.PI * 40;
  el.querySelector('.t').textContent = left > 0 ? left : '⏰';
  el.querySelector('.ring').style.strokeDashoffset = L * (1 - left / T.tot);
  el.classList.toggle('over', left <= 0);
}

/* =========================================================
   Événements
   ========================================================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.a]; if (!fn) return;
  Snd.init(); if (el.dataset.a !== 'bgClose') Snd.tap();
  fn(el.dataset, el, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.field === 'pname'){ S.players[+t.dataset.i].name = t.value; savePlayers(); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'wa'){ e.preventDefault(); $('#wb').focus(); }
  else if (e.target.id === 'wb'){ e.preventDefault(); ACTIONS.addWord(); }
  else if (e.target.dataset && e.target.dataset.field === 'pname') e.target.blur();
});
/* carte « maintiens pour voir » */
let holdEl = null;
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('[data-hold]'); if (!h) return;
  e.preventDefault(); Snd.init();
  holdEl = h; h.classList.add('on');
  try { h.setPointerCapture(e.pointerId); } catch(_){}
  if (navigator.vibrate) try { navigator.vibrate(25); } catch(_){}
  S.ui.revealed = true;
  const b = document.getElementById('seenBtn'); if (b) b.disabled = false;
});
const releaseHold = () => { if (holdEl){ holdEl.classList.remove('on'); holdEl = null; } };
document.addEventListener('pointerup', releaseHold);
document.addEventListener('pointercancel', releaseHold);
window.addEventListener('blur', releaseHold);
document.addEventListener('contextmenu', e => { if (e.target.closest('[data-hold]')) e.preventDefault(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) releaseHold(); else if (S.view === 'game'){ wakeLock = null; wake(true); }
});

/* hors ligne (GitHub Pages / https uniquement) */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

render();
</script>
